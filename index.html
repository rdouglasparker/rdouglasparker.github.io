  :root{
    --display:'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;   /* headings */
    --body:'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;      /* body and buttons */
  }
  :root{
    --purple:#592C88;
    --purple-deep:#2A1247;
    --purple-mid:#7A4FA8;
    --gold:#B9975B;
    --gold-light:#E6D2A6;
    --mist:#F3F0F7;
    --card:#FFFFFF;
    --ink:#241A33;
    --slate:#61596F;
    --line:#DDD5E6;
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--mist); color:var(--ink);
    font-family:var(--body); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }

  /* ---------- Banner, with a ridgeline traced from the photo rising into the page ---------- */
  .top-banner{ position:relative; line-height:0; background:var(--purple-deep); }
  .top-banner img{ display:block; width:100%; height:auto; }
  .ridge{ position:absolute; left:0; right:0; bottom:-1px; width:100%; height:clamp(34px,5.5vw,80px); display:block; }
  .ridge .fill{ fill:var(--mist); }
  .ridge .edge{ fill:none; stroke:var(--gold); stroke-width:2.5; vector-effect:non-scaling-stroke; }

  .wrap{ position:relative; max-width:1080px; margin:0 auto; padding:0 6vw; }

  .intro{ padding:34px 0 44px; }
  .intro h1{
    font-family:var(--display); font-weight:600;
    font-size:clamp(30px,3.9vw,46px); line-height:1.15; letter-spacing:-.015em;
    color:var(--purple-deep); margin:0 0 14px; max-width:15em; text-wrap:balance;
  }
  .intro p{ margin:0; max-width:34em; color:var(--slate); font-size:17.5px; }

  /* ---------- Course rows ---------- */
  .courses{ display:flex; flex-direction:column; gap:26px; padding-bottom:84px; }

  .course{
    display:grid; grid-template-columns:minmax(300px,43%) 1fr;
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(42,18,71,.06), 0 10px 26px rgba(42,18,71,.08);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .course:hover{ transform:translateY(-3px); box-shadow:0 2px 4px rgba(42,18,71,.08), 0 18px 36px rgba(42,18,71,.16); }
  .course:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }

  .course-art{
    position:relative; isolation:isolate; overflow:hidden;
    min-height:220px; padding:30px 32px;
    display:flex; flex-direction:column; align-items:flex-start; gap:14px;
    color:#fff; background:var(--purple-deep);
  }
  .course-art::before{
    content:""; position:absolute; inset:0; z-index:-2;
    background:var(--art) center bottom / cover no-repeat;
    transition:transform .8s ease;
  }
  .course-art::after{
    content:""; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(180deg, rgba(30,12,52,.80) 0%, rgba(30,12,52,.42) 52%, rgba(30,12,52,.04) 100%);
  }
  .course:hover .course-art::before{ transform:scale(1.05); }

  .blaze{
    font-weight:600; font-size:14px; letter-spacing:.05em;
    color:var(--gold-light); border:1.5px solid var(--gold); border-radius:3px;
    padding:2px 10px; background:rgba(30,12,52,.35);
  }
  .course-name{
    font-family:var(--display); font-weight:600;
    font-size:clamp(26px,3vw,37px); line-height:1.12; letter-spacing:-.01em; margin:0;
    text-shadow:0 2px 14px rgba(20,8,36,.55);
  }

  .course-info{ padding:30px 34px; display:flex; flex-direction:column; gap:18px; justify-content:center; }
  .course-desc{ margin:0; color:var(--slate); font-size:16.5px; }
  .chips{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
  .chips li{
    font-size:14.5px; font-weight:500; color:var(--purple);
    background:#F1EBF8; border-radius:999px; padding:4px 12px;
  }
  .open{
    align-self:flex-start; margin-top:4px;
    background:var(--purple); color:#fff; font-weight:600; font-size:15.5px;
    padding:10px 24px; border-radius:999px; border-bottom:3px solid var(--gold);
    transition:background .15s ease;
  }
  .course:hover .open{ background:var(--purple-deep); }

  .soon{
    border:1.5px dashed var(--line); border-radius:6px; padding:22px;
    text-align:center; color:var(--slate); font-size:15px;
  }

  /* ---------- Footer ---------- */
  footer{ position:relative; background:var(--purple-deep); color:#E4D9F2; padding:0 0 40px; margin-top:0; }
  footer .ridge-top{ position:absolute; left:0; right:0; top:calc(-1 * clamp(34px,5.5vw,80px) + 1px); width:100%; height:clamp(34px,5.5vw,80px); display:block; }
  footer .ridge-top .fill{ fill:var(--purple-deep); }
  footer .ridge-top .edge{ fill:none; stroke:var(--gold); stroke-width:2; vector-effect:non-scaling-stroke; }
  .foot-inner{ max-width:1080px; margin:0 auto; padding:26px 6vw 0; display:flex; flex-wrap:wrap; gap:8px 48px; align-items:baseline; justify-content:space-between; }
  .foot-name{ font-family:var(--display); font-weight:600; font-size:22px; color:#fff; margin:0; letter-spacing:-.005em; }
  .foot-role{ margin:2px 0 0; font-size:14.5px; color:var(--gold-light); }
  .foot-contact{ font-size:14.5px; margin:0; text-align:right; }
  .foot-contact a{ color:#fff; border-bottom:1px solid var(--gold); }
  .foot-contact a:hover{ color:var(--gold-light); }

  @media (max-width:760px){
    .course{ grid-template-columns:1fr; }
    .course-art{ min-height:190px; }
    .course-info{ padding:24px 24px 28px; }
    .foot-contact{ text-align:left; }
  }
  @media (prefers-reduced-motion:reduce){
    .course, .course-art::before{ transition:none; }
    .course:hover{ transform:none; }
    .course:hover .course-art::before{ transform:none; }
  }
</style>

  function rowHTML(c){
    var artAttr = c.art ? ' style="--art:url(\'' + c.art + '\')"' : '';
    return '<a class="course" href="' + c.href + '">' +
      '<div class="course-art"' + artAttr + '>' +
        '<span class="blaze">' + c.code + '</span>' +
        '<h2 class="course-name">' + c.name + '</h2>' +
      '</div>' +
      '<div class="course-info">' +
        '<p class="course-desc">' + c.desc + '</p>' +
        '<ul class="chips">' + c.resources.map(function(r){ return '<li>' + r + '</li>'; }).join('') + '</ul>' +
        '<span class="open">Open course</span>' +
      '</div>' +
    '</a>';
  }

  document.getElementById('courseGrid').innerHTML =
    COURSES.map(rowHTML).join('') + '<div class="soon">More courses coming soon</div>';
})();
