<!-- title text with soft contrast panel -->
<rect x="300" y="316" width="600" height="0" opacity="0"/>
<rect x="300" y="18" width="600" height="76" rx="10" fill="#38251A" opacity="0.4"/>
<text x="600" y="48" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">ACCT 351 &#183; CH. 3</text>
<text x="600" y="80" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="30" fill="#FFFFFF">Jackson Office Supply Co.</text>

</svg>
