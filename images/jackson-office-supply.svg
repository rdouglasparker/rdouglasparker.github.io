  <!-- ledger -->
  <g transform="translate(730,238)">
    <path d="M0 20 L0 70 L95 82 L95 30 Z" fill="#FFFDF6" stroke="#C9BB8E" stroke-width="2"/>
    <path d="M0 20 L0 70" stroke="#C9BB8E" stroke-width="2"/>
    <line x1="10" y1="38" x2="85" y2="44" stroke="#D8CBA0" stroke-width="2"/>
    <line x1="10" y1="52" x2="85" y2="58" stroke="#D8CBA0" stroke-width="2"/>
  </g>

  <!-- calculator -->
  <g transform="translate(845,240)">
    <rect x="0" y="0" width="66" height="50" rx="5" fill="#3A3A3A"/>
    <rect x="6" y="6" width="54" height="14" rx="2" fill="#B7D8B0"/>
    <g fill="#666">
      <rect x="8" y="26" width="10" height="8" rx="1"/>
      <rect x="22" y="26" width="10" height="8" rx="1"/>
      <rect x="36" y="26" width="10" height="8" rx="1"/>
      <rect x="50" y="26" width="10" height="8" rx="1"/>
      <rect x="8" y="38" width="10" height="8" rx="1"/>
      <rect x="22" y="38" width="10" height="8" rx="1"/>
      <rect x="36" y="38" width="10" height="8" rx="1"/>
      <rect x="50" y="38" width="10" height="8" rx="1"/>
    </g>
  </g>

  <!-- pen cup -->
  <g transform="translate(940,225)">
    <path d="M0 20 L6 65 L44 65 L50 20 Z" fill="#4A6FA5"/>
    <ellipse cx="25" cy="20" rx="25" ry="7" fill="#5C7FB0"/>
    <line x1="12" y1="18" x2="6" y2="-24" stroke="#D9A441" stroke-width="5" stroke-linecap="round"/>
    <line x1="25" y1="16" x2="28" y2="-30" stroke="#3E8C5C" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="18" x2="44" y2="-20" stroke="#B3401E" stroke-width="5" stroke-linecap="round"/>
  </g>
