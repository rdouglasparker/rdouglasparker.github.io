<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#E4E9EC"/>
    <stop offset="100%" stop-color="#F3F0E6"/>
  </linearGradient>
</defs>

<rect width="1200" height="400" fill="url(#wall)"/>
<rect x="0" y="300" width="1200" height="100" fill="#B98A55"/>
<rect x="0" y="300" width="1200" height="100" fill="#A97A46" opacity="0.35"/>
<g stroke="#8C6A3E" stroke-width="1" opacity="0.4">
  <line x1="0" y1="330" x2="1200" y2="330"/>
  <line x1="0" y1="360" x2="1200" y2="360"/>
</g>

<!-- shelving unit -->
<g>
  <rect x="200" y="70" width="440" height="230" fill="#8C6239"/>
  <rect x="212" y="82" width="416" height="60" fill="#6E4B28"/>
  <rect x="212" y="150" width="416" height="60" fill="#6E4B28"/>
  <rect x="212" y="218" width="416" height="60" fill="#6E4B28"/>

  <!-- top shelf: paper reams -->
  <rect x="222" y="96" width="70" height="42" rx="3" fill="#F4EFDF" stroke="#D9CBA0" stroke-width="2"/>
  <text x="257" y="121" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#8C6A3E">PAPER</text>
  <rect x="300" y="96" width="70" height="42" rx="3" fill="#F4EFDF" stroke="#D9CBA0" stroke-width="2"/>
  <text x="335" y="121" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#8C6A3E">PAPER</text>
  <rect x="378" y="90" width="46" height="48" rx="3" fill="#4A6FA5"/>
  <rect x="432" y="90" width="46" height="48" rx="3" fill="#B3401E"/>
  <rect x="486" y="90" width="46" height="48" rx="3" fill="#3E8C5C"/>
  <rect x="548" y="94" width="60" height="44" rx="3" fill="#F4EFDF" stroke="#D9CBA0" stroke-width="2"/>
  <text x="578" y="119" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#8C6A3E">BOX</text>

  <!-- middle shelf: binders -->
  <rect x="222" y="160" width="26" height="46" fill="#4A6FA5"/>
  <rect x="250" y="160" width="26" height="46" fill="#3E8C5C"/>
  <rect x="278" y="160" width="26" height="46" fill="#B3401E"/>
  <rect x="306" y="160" width="26" height="46" fill="#D9A441"/>
  <rect x="334" y="160" width="26" height="46" fill="#6E3FA3"/>
  <circle cx="420" cy="188" r="22" fill="#F4EFDF" stroke="#D9CBA0" stroke-width="2"/>
  <g stroke="#8C6A3E" stroke-width="2">
    <line x1="420" y1="174" x2="420" y2="202"/>
    <line x1="406" y1="188" x2="434" y2="188"/>
  </g>
  <rect x="466" y="164" width="120" height="40" rx="4" fill="#F4EFDF" stroke="#D9CBA0" stroke-width="2"/>
  <text x="526" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#8C6A3E">SUPPLIES</text>

  <!-- bottom shelf: boxes -->
  <rect x="222" y="230" width="90" height="44" rx="3" fill="#C89A5F" stroke="#8C6A3E" stroke-width="2"/>
  <line x1="222" y1="244" x2="312" y2="244" stroke="#8C6A3E" stroke-width="2"/>
  <rect x="322" y="230" width="90" height="44" rx="3" fill="#C89A5F" stroke="#8C6A3E" stroke-width="2"/>
  <line x1="322" y1="244" x2="412" y2="244" stroke="#8C6A3E" stroke-width="2"/>
  <rect x="430" y="230" width="90" height="44" rx="3" fill="#C89A5F" stroke="#8C6A3E" stroke-width="2"/>
  <line x1="430" y1="244" x2="520" y2="244" stroke="#8C6A3E" stroke-width="2"/>
  <rect x="536" y="222" width="70" height="52" rx="3" fill="#F4EFDF" stroke="#D9CBA0" stroke-width="2"/>
  <text x="571" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#8C6A3E">PENS</text>
