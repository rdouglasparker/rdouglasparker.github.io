<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyVC" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#BFE3F4"/>
    <stop offset="100%" stop-color="#EAF6FB"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" fill="url(#skyVC)"/>
<polygon points="0,150 180,70 340,150 520,60 700,150 860,90 1040,150 1200,110 1200,190 0,190" fill="#AFC7D6" opacity="0.6"/>

<!-- sidewalk -->
<rect x="0" y="330" width="1200" height="70" fill="#9AA1A6"/>
<rect x="0" y="330" width="1200" height="6" fill="#7E858A"/>
<g stroke="#83898D" stroke-width="1.5" opacity="0.6">
  <line x1="200" y1="330" x2="180" y2="400"/>
  <line x1="600" y1="330" x2="600" y2="400"/>
  <line x1="1000" y1="330" x2="1020" y2="400"/>
</g>

<!-- LEFT BUILDING: Highlands Advisory Group -->
<g>
  <rect x="200" y="120" width="360" height="215" fill="#D7CBB2"/>
  <rect x="200" y="120" width="360" height="14" fill="#B7A87F"/>
  <rect x="220" y="150" width="320" height="30" rx="4" fill="#38195A"/>
  <text x="380" y="171" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="700" font-size="16" fill="#F1E9D6">HIGHLANDS ADVISORY GROUP</text>

  <!-- window with bar chart and target -->
  <rect x="230" y="200" width="150" height="110" rx="4" fill="#F3F0E6" stroke="#8C6A3E" stroke-width="6"/>
  <g>
    <rect x="248" y="270" width="16" height="26" fill="#4A6FA5"/>
    <rect x="272" y="255" width="16" height="41" fill="#4A6FA5"/>
    <rect x="296" y="235" width="16" height="61" fill="#3E8C5C"/>
    <rect x="320" y="250" width="16" height="46" fill="#4A6FA5"/>
    <line x1="245" y1="298" x2="345" y2="298" stroke="#5A5650" stroke-width="2"/>
  </g>

  <!-- target/bullseye window -->
  <rect x="400" y="200" width="140" height="110" rx="4" fill="#F3F0E6" stroke="#8C6A3E" stroke-width="6"/>
  <g transform="translate(470,255)">
    <circle r="40" fill="#B3401E"/>
    <circle r="27" fill="#F1E9D6"/>
    <circle r="14" fill="#B3401E"/>
    <circle r="4" fill="#F1E9D6"/>
  </g>

  <!-- door -->
  <rect x="330" y="220" width="0" height="0"/>
</g>

<!-- door for left building, centered -->
<g>
  <rect x="360" y="255" width="0" height="0"/>
</g>

<!-- RIGHT BUILDING: Ridgeline Elevator Care -->
<g>
  <rect x="640" y="120" width="360" height="215" fill="#CBD3D6"/>
  <rect x="640" y="120" width="360" height="14" fill="#A9B3B7"/>
  <rect x="660" y="150" width="320" height="30" rx="4" fill="#2E5F4E"/>
  <text x="820" y="171" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="700" font-size="16" fill="#F1E9D6">RIDGELINE ELEVATOR CARE</text>

  <!-- elevator doors -->
  <g transform="translate(700,205)">
    <rect x="0" y="0" width="130" height="120" rx="3" fill="#5A5650"/>
    <rect x="6" y="6" width="57" height="108" fill="#8C939A"/>
    <rect x="67" y="6" width="57" height="108" fill="#8C939A"/>
    <circle cx="63" cy="60" r="4" fill="#F1E9D6"/>
    <circle cx="67" cy="60" r="4" fill="#F1E9D6"/>
  </g>

  <!-- probability gauge above -->
  <g transform="translate(870,215)">
    <path d="M0 60 A60 60 0 0 1 120 60" fill="none" stroke="#8C6A3E" stroke-width="8"/>
    <path d="M0 60 A60 60 0 0 1 84 12" fill="none" stroke="#3E8C5C" stroke-width="8"/>
    <line x1="60" y1="60" x2="88" y2="24" stroke="#B3401E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="6" fill="#B3401E"/>
    <text x="60" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#38195A">LIKELY</text>
  </g>
</g>

<text x="600" y="368" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="16" letter-spacing="2" fill="#38195A" opacity="0.75">ACCT 351 &#183; VARIABLE CONSIDERATION</text>
</svg>
