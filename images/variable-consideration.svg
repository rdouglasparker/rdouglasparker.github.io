<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#592C88"/>
      <stop offset="100%" stop-color="#38195A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg8)"/>
  <g stroke="#D6C398" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>
  <g transform="translate(600,150)">
    <!-- back die, offset up-left, showing 2 pips -->
    <rect x="-108" y="-64" width="86" height="86" rx="12" fill="none" stroke="#D6C398" stroke-opacity="0.55" stroke-width="5" transform="rotate(-8)"/>
    <g transform="rotate(-8)">
      <circle cx="-85" cy="-42" r="6" fill="#D6C398" fill-opacity="0.55"/>
      <circle cx="-45" cy="-4" r="6" fill="#D6C398" fill-opacity="0.55"/>
    </g>
    <!-- front die, showing 5 pips -->
    <rect x="-30" y="-38" width="104" height="104" rx="14" fill="none" stroke="#D6C398" stroke-width="6" transform="rotate(7)"/>
    <g transform="rotate(7)">
      <circle cx="-12" cy="-20" r="7" fill="#D6C398"/>
      <circle cx="60" cy="-20" r="7" fill="#D6C398"/>
      <circle cx="24" cy="14" r="7" fill="#D6C398"/>
      <circle cx="-12" cy="48" r="7" fill="#D6C398"/>
      <circle cx="60" cy="48" r="7" fill="#D6C398"/>
    </g>
  </g>
  <text x="600" y="300" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="20" letter-spacing="2" fill="#B0925C">ACCT 351 &#183; VARIABLE CONSIDERATION</text>
  <text x="600" y="335" text-anchor="middle" font-family="'Source Serif 4', serif" font-size="26" font-weight="600" fill="#F1E9D6">Variable Consideration Exercises</text>
</svg>
