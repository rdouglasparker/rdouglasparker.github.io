<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyCFW" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#F6D9A0"/><stop offset="55%" stop-color="#E9D3D6"/><stop offset="100%" stop-color="#DCE3EE"/>
  </linearGradient>
  <radialGradient id="sunCFW" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFF3D0"/><stop offset="55%" stop-color="#F0C24A"/><stop offset="100%" stop-color="#D6A233"/>
  </radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#skyCFW)"/>

<!-- layered smoky ridges -->
<path d="M0 190 C120 150,260 175,380 155 C520 132,620 168,760 148 C900 128,1000 160,1200 140 L1200 260 L0 260 Z" fill="#C7A9BD" opacity="0.5"/>
<path d="M0 215 C150 180,300 205,430 188 C560 170,680 200,820 182 C960 164,1050 195,1200 178 L1200 275 L0 275 Z" fill="#AD8FAE" opacity="0.62"/>
<path d="M0 238 C130 208,280 232,400 218 C540 202,660 230,800 214 C940 198,1040 224,1200 210 L1200 288 L0 288 Z" fill="#8E739E" opacity="0.75"/>
<path d="M0 258 C160 232,300 252,450 240 C580 230,700 252,850 240 C980 230,1080 250,1200 238 L1200 300 L0 300 Z" fill="#6E5A8C" opacity="0.88"/>

<rect x="0" y="270" width="1200" height="130" fill="#4C7A5B"/>
<path d="M0 270 Q200 250 400 272 Q600 292 800 268 Q1000 248 1200 274 L1200 400 L0 400 Z" fill="#3E6B4C"/>
<g fill="#2F5A3D">
  <path d="M1130 292 L1110 332 L1150 332 Z"/><path d="M1130 277 L1114 312 L1146 312 Z"/><rect x="1126" y="332" width="8" height="12"/>
</g>

<!-- winding trail toward the summit payoff -->
<path d="M60 375 Q220 358 330 335 Q450 310 545 282 Q660 246 780 205 Q880 172 975 128"
      fill="none" stroke="#EFE6D2" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.9"/>
<polygon points="890,270 975,120 1065,270" fill="#6E93A8"/>
<polygon points="935,205 975,120 1020,205" fill="#EFF3F6"/>
<circle cx="975" cy="108" r="34" fill="url(#sunCFW)"/>
<circle cx="975" cy="108" r="34" fill="none" stroke="#B0803A" stroke-width="2" opacity="0.6"/>
<text x="975" y="116" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-weight="700" font-size="20" fill="#6B4A18">COGS</text>

<!-- crates with cost tags climbing the trail (checkpoints) -->
<g>
  <g transform="translate(70,368)"><circle r="16" fill="#3E8C5C"/><text x="0" y="4" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#fff">$8</text></g>
  <g transform="translate(330,335)"><circle r="16" fill="#8C5FA8"/><text x="0" y="4" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#fff">$9</text></g>
  <g transform="translate(545,282)"><circle r="16" fill="#6E3FA3"/><text x="0" y="4" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#fff">$10</text></g>
  <g transform="translate(780,205)"><circle r="16" fill="#38195A"/><text x="0" y="4" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" fill="#fff">FIFO</text></g>
</g>

<!-- wooden trail sign -->
<g transform="translate(160,225)">
  <rect x="9" y="0" width="10" height="110" fill="#6B4A34"/>
  <rect x="-20" y="6" width="98" height="26" rx="4" fill="#8A6642"/>
  <text x="29" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">PRACTICE</text>
  <rect x="-6" y="38" width="70" height="24" rx="4" fill="#8A6642"/>
  <text x="29" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">TRAIL</text>
</g>

<rect x="230" y="30" width="740" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">GUIDED WALKTHROUGH</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="25" fill="#FFFFFF">Inventory Cost Flow Practice</text>
</svg>
