<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyHTO" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#F5C99B"/>
    <stop offset="55%" stop-color="#F0DDBE"/>
    <stop offset="100%" stop-color="#EAF3EE"/>
  </linearGradient>
</defs>

<rect width="1200" height="400" fill="url(#skyHTO)"/>
<circle cx="960" cy="110" r="46" fill="#FBE29A" opacity="0.9"/>

<!-- far mountains -->
<polygon points="0,220 150,110 280,200 430,90 590,210 740,130 900,215 1060,105 1200,190 1200,260 0,260" fill="#9FAEC2"/>
<polygon points="0,250 170,160 340,245 500,150 660,250 820,170 990,245 1150,175 1200,210 1200,290 0,290" fill="#7C93A3"/>

<!-- ground -->
<rect x="0" y="270" width="1200" height="130" fill="#4C7A5B"/>
<path d="M0 270 Q200 250 400 272 Q600 292 800 268 Q1000 248 1200 274 L1200 400 L0 400 Z" fill="#3E6B4C"/>

<!-- still lake -->
<ellipse cx="270" cy="320" rx="180" ry="34" fill="#7FB4D9" opacity="0.85"/>
<ellipse cx="270" cy="320" rx="180" ry="34" fill="none" stroke="#6E9FC2" stroke-width="2" opacity="0.5"/>

<!-- canoe on the lake -->
<g transform="translate(190,300)">
  <path d="M0 20 Q60 0 130 14 Q100 30 60 30 Q25 30 0 20 Z" fill="#B3401E"/>
  <path d="M8 18 Q60 8 122 15" fill="none" stroke="#8C3015" stroke-width="3"/>
</g>

<!-- pine trees -->
<g fill="#2F5A3D">
  <path d="M1060 300 L1040 340 L1080 340 Z"/><path d="M1060 285 L1044 320 L1076 320 Z"/><rect x="1056" y="340" width="8" height="12"/>
  <path d="M1120 312 L1100 352 L1140 352 Z"/><path d="M1120 297 L1104 332 L1136 332 Z"/><rect x="1116" y="352" width="8" height="12"/>
  <path d="M120 300 L100 340 L140 340 Z"/><path d="M120 285 L104 320 L136 320 Z"/><rect x="116" y="340" width="8" height="12"/>
</g>

<!-- tent -->
<g transform="translate(560,235)">
  <polygon points="0,90 70,0 140,90" fill="#3E6B9E"/>
  <polygon points="55,90 70,40 85,90" fill="#2E5480"/>
  <polygon points="0,90 140,90 140,98 0,98" fill="#2E5480"/>
  <line x1="70" y1="0" x2="70" y2="18" stroke="#8C6A3E" stroke-width="4"/>
</g>

<!-- campfire with crossed logs -->
<g transform="translate(740,270)">
  <ellipse cx="30" cy="55" rx="34" ry="8" fill="#5A4632" opacity="0.4"/>
  <line x1="0" y1="20" x2="60" y2="45" stroke="#6E4B28" stroke-width="7" stroke-linecap="round"/>
  <line x1="60" y1="20" x2="0" y2="45" stroke="#8C6642" stroke-width="7" stroke-linecap="round"/>
  <path d="M22 44 Q30 20 26 4 Q40 22 34 40 Q42 30 40 18 Q52 34 40 48 Q30 56 22 44 Z" fill="#F0A03C"/>
  <path d="M27 42 Q32 28 29 16 Q36 26 33 38 Z" fill="#FBE29A"/>
</g>

<!-- crossed trekking poles leaning on a rock -->
<g transform="translate(870,250)">
  <ellipse cx="20" cy="90" rx="36" ry="14" fill="#8C939A"/>
  <line x1="0" y1="90" x2="55" y2="0" stroke="#5A5650" stroke-width="6" stroke-linecap="round"/>
  <line x1="45" y1="90" x2="-10" y2="0" stroke="#B0925C" stroke-width="6" stroke-linecap="round"/>
  <circle cx="55" cy="0" r="6" fill="#B3401E"/>
  <circle cx="-10" cy="0" r="6" fill="#3E8C5C"/>
</g>

<!-- wooden trail sign -->
<g transform="translate(400,225)">
  <rect x="9" y="0" width="10" height="110" fill="#6B4A34"/>
  <rect x="-14" y="6" width="90" height="26" rx="4" fill="#8A6642"/>
  <text x="31" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F3E9D6">HIGHLANDS</text>
  <rect x="-6" y="38" width="70" height="24" rx="4" fill="#8A6642"/>
  <text x="29" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">TRAIL</text>
</g>

<!-- title text with soft contrast panel -->
<rect x="330" y="30" width="540" height="76" rx="10" fill="#20303A" opacity="0.4"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">ACCT 351 &#183; CH. 7</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="28" fill="#FFFFFF">Highlands Trail Outfitters</text>

</svg>
