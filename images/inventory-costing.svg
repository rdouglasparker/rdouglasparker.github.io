<!-- title text with soft contrast panel -->
<rect x="300" y="18" width="600" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="48" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#E4EEF0">ACCT 351 &#183; CH. 8</text>
