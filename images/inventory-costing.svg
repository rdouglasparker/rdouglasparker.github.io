<!-- hand truck wheeling a box away -->
<g transform="translate(680,175)">
  <rect x="20" y="20" width="60" height="60" rx="3" fill="#C89A5F" stroke="#8C6A3E" stroke-width="2"/>
  <line x1="20" y1="42" x2="80" y2="42" stroke="#8C6A3E" stroke-width="2"/>
