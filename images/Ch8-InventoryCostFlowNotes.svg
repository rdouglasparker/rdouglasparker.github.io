<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyCF" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#DCEAF2"/><stop offset="60%" stop-color="#EDE6EF"/><stop offset="100%" stop-color="#F4EEE3"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" fill="url(#skyCF)"/>

<!-- layered smoky ridges, receding into haze (a different mountain treatment from the jagged-peak cards) -->
<path d="M0 190 C120 150,260 175,380 155 C520 132,620 168,760 148 C900 128,1000 160,1200 140 L1200 260 L0 260 Z" fill="#B7C4D6" opacity="0.55"/>
<path d="M0 215 C150 180,300 205,430 188 C560 170,680 200,820 182 C960 164,1050 195,1200 178 L1200 275 L0 275 Z" fill="#9CADC4" opacity="0.65"/>
<path d="M0 238 C130 208,280 232,400 218 C540 202,660 230,800 214 C940 198,1040 224,1200 210 L1200 288 L0 288 Z" fill="#8093AF" opacity="0.75"/>
<path d="M0 258 C160 232,300 252,450 240 C580 230,700 252,850 240 C980 230,1080 250,1200 238 L1200 300 L0 300 Z" fill="#647797" opacity="0.85"/>

<!-- ground -->
<rect x="0" y="270" width="1200" height="130" fill="#4C7A5B"/>
<path d="M0 270 Q200 250 400 272 Q600 292 800 268 Q1000 248 1200 274 L1200 400 L0 400 Z" fill="#3E6B4C"/>

<g fill="#2F5A3D">
  <path d="M1130 292 L1110 332 L1150 332 Z"/><path d="M1130 277 L1114 312 L1146 312 Z"/><rect x="1126" y="332" width="8" height="12"/>
  <path d="M70 296 L52 330 L88 330 Z"/><path d="M70 283 L56 312 L84 312 Z"/><rect x="66" y="330" width="8" height="12"/>
</g>

<!-- conveyor belt with cost-tagged crates, illustrating cost flow order -->
<g transform="translate(230,300)">
  <rect x="-20" y="40" width="620" height="14" fill="#5A4A38"/>
  <circle cx="-10" cy="47" r="16" fill="#332B22"/><circle cx="-10" cy="47" r="6" fill="#8C939A"/>
  <circle cx="610" cy="47" r="16" fill="#332B22"/><circle cx="610" cy="47" r="6" fill="#8C939A"/>

  <!-- crates labeled with unit costs, oldest (left) to newest (right) -->
  <g>
    <rect x="0" y="-30" width="46" height="42" rx="3" fill="#B0925C"/>
    <text x="23" y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#F3E9D6">$10</text>
  </g>
  <g>
    <rect x="60" y="-30" width="46" height="42" rx="3" fill="#A17F4C"/>
    <text x="83" y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#F3E9D6">$12</text>
  </g>
  <g>
    <rect x="120" y="-30" width="46" height="42" rx="3" fill="#8C6642"/>
    <text x="143" y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#F3E9D6">$13</text>
  </g>
</g>

<!-- FIFO arrow (from left / oldest) -->
<g transform="translate(150,255)">
  <path d="M60 0 L0 0" stroke="#3E8C5C" stroke-width="5" marker-end="url(#arrowG)"/>
  <text x="30" y="-10" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#2F5A3D">FIFO</text>
</g>
<!-- LIFO arrow (from right / newest) -->
<g transform="translate(870,255)">
  <path d="M0 0 L60 0" stroke="#8C1F1B" stroke-width="5" marker-end="url(#arrowR)"/>
  <text x="30" y="-10" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#8C1F1B">LIFO</text>
</g>
<defs>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3E8C5C"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C1F1B"/></marker>
</defs>

<!-- AVERAGE label centered below the belt -->
<rect x="380" y="355" width="320" height="24" rx="4" fill="#FFFFFF" opacity="0.7"/>
<text x="540" y="371" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#6E3FA3">AVERAGE COST BLENDS ALL THREE</text>

<rect x="270" y="30" width="660" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">TOPIC NOTES</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="26" fill="#FFFFFF">Inventory Cost Flow Assumptions</text>
</svg>
