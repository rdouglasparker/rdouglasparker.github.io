<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyPVW" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#F6D9A0"/>
    <stop offset="50%" stop-color="#E8C9C0"/>
    <stop offset="100%" stop-color="#E4DCEF"/>
  </linearGradient>
  <radialGradient id="sunPVW" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFF3D0"/>
    <stop offset="55%" stop-color="#F0C24A"/>
    <stop offset="100%" stop-color="#D6A233"/>
  </radialGradient>
</defs>

<rect width="1200" height="400" fill="url(#skyPVW)"/>

<!-- far mountains -->
<polygon points="0,225 150,120 280,205 430,100 590,215 740,135 900,220 1060,110 1200,195 1200,260 0,260" fill="#A79CC0"/>
<polygon points="0,250 170,165 340,245 500,155 660,250 820,175 990,245 1150,180 1200,212 1200,290 0,290" fill="#83739F"/>

<!-- ground -->
<rect x="0" y="270" width="1200" height="130" fill="#4C7A5B"/>
<path d="M0 270 Q200 250 400 272 Q600 292 800 268 Q1000 248 1200 274 L1200 400 L0 400 Z" fill="#3E6B4C"/>

<!-- pine trees for scenery continuity -->
<g fill="#2F5A3D">
  <path d="M1130 292 L1110 332 L1150 332 Z"/><path d="M1130 277 L1114 312 L1146 312 Z"/><rect x="1126" y="332" width="8" height="12"/>
</g>

<!-- winding trail rising left to right toward the summit payoff -->
<path d="M60 375 Q220 358 330 335 Q450 310 545 282 Q660 246 780 205 Q880 172 975 128"
      fill="none" stroke="#EFE6D2" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.9"/>

<!-- mountain peak the trail leads to -->
<polygon points="890,270 975,120 1065,270" fill="#6E93A8"/>
<polygon points="935,205 975,120 1020,205" fill="#EFF3F6"/>

<!-- the payoff: a glowing coin/sun at the summit -->
<circle cx="975" cy="108" r="34" fill="url(#sunPVW)"/>
<circle cx="975" cy="108" r="34" fill="none" stroke="#B0803A" stroke-width="2" opacity="0.6"/>
<text x="975" y="118" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-weight="700" font-size="28" fill="#6B4A18">$</text>

<!-- checkpoint markers along the trail, each a checkmark badge (self-check practice) -->
<g>
  <g transform="translate(70,368)">
    <circle r="15" fill="#3E8C5C"/>
    <path d="M-6 0 L-1 5 L7 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(330,335)">
    <circle r="15" fill="#8C5FA8"/>
    <path d="M-6 0 L-1 5 L7 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(545,282)">
    <circle r="15" fill="#6E3FA3"/>
    <path d="M-6 0 L-1 5 L7 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(780,205)">
    <circle r="15" fill="#38195A"/>
    <path d="M-6 0 L-1 5 L7 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>

<!-- handheld financial calculator resting at the trailhead -->
<g transform="translate(115,300)">
  <rect x="0" y="0" width="58" height="78" rx="6" fill="#332B3D"/>
  <rect x="6" y="8" width="46" height="16" rx="2" fill="#9FD9A8"/>
  <text x="29" y="20" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#1B3B22">0.00</text>
  <g fill="#585064">
    <rect x="6" y="30" width="12" height="10" rx="2"/><rect x="23" y="30" width="12" height="10" rx="2"/><rect x="40" y="30" width="12" height="10" rx="2"/>
    <rect x="6" y="44" width="12" height="10" rx="2"/><rect x="23" y="44" width="12" height="10" rx="2"/><rect x="40" y="44" width="12" height="10" rx="2"/>
    <rect x="6" y="58" width="12" height="10" rx="2"/><rect x="23" y="58" width="12" height="10" rx="2"/><rect x="40" y="58" width="12" height="10" rx="2"/>
  </g>
</g>

<!-- wooden trail sign, matching the style used across other topic cards -->
<g transform="translate(190,225)">
  <rect x="9" y="0" width="10" height="110" fill="#6B4A34"/>
  <rect x="-20" y="6" width="98" height="26" rx="4" fill="#8A6642"/>
  <text x="29" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">PRACTICE</text>
  <rect x="-6" y="38" width="70" height="24" rx="4" fill="#8A6642"/>
  <text x="29" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">TRAIL</text>
</g>

<!-- title text with soft contrast panel, matching the assignment-card title treatment -->
<rect x="270" y="30" width="660" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">GUIDED WALKTHROUGH &#183; TIME VALUE OF MONEY</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="28" fill="#FFFFFF">Present Value Practice</text>

</svg>
