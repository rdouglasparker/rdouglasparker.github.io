<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#AEE0F4"/>
    <stop offset="100%" stop-color="#EAF6F2"/>
  </linearGradient>
  <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFE9A8"/>
    <stop offset="100%" stop-color="#FFD066"/>
  </linearGradient>
</defs>

<rect width="1200" height="400" fill="url(#sky)"/>
<circle cx="1010" cy="95" r="52" fill="url(#sun)" opacity="0.9"/>

<!-- far mountains -->
<polygon points="0,230 140,120 260,210 380,90 520,220 660,140 800,225 960,110 1120,215 1200,170 1200,260 0,260" fill="#9FB6C9"/>
<!-- mid mountains -->
<polygon points="0,260 160,160 320,250 470,150 640,255 800,175 970,250 1130,180 1200,220 1200,290 0,290" fill="#7C9C8E"/>
<!-- snow caps -->
<polygon points="320,250 300,225 340,225" fill="#F3F8F6"/>
<polygon points="640,255 618,228 660,228" fill="#F3F8F6"/>
<polygon points="970,250 950,222 992,222" fill="#F3F8F6"/>

<!-- near tree line / ground -->
<rect x="0" y="270" width="1200" height="130" fill="#4C7A5B"/>
<path d="M0 270 Q200 250 400 272 Q600 292 800 268 Q1000 248 1200 274 L1200 400 L0 400 Z" fill="#3E6B4C"/>

<!-- pine trees scattered -->
<g fill="#2F5A3D">
  <path d="M90 300 L70 340 L110 340 Z"/><path d="M90 285 L74 320 L106 320 Z"/><rect x="86" y="340" width="8" height="12"/>
  <path d="M170 310 L150 350 L190 350 Z"/><path d="M170 295 L154 330 L186 330 Z"/><rect x="166" y="350" width="8" height="12"/>
  <path d="M1040 300 L1020 340 L1060 340 Z"/><path d="M1040 285 L1024 320 L1056 320 Z"/><rect x="1036" y="340" width="8" height="12"/>
  <path d="M1110 312 L1090 352 L1130 352 Z"/><path d="M1110 297 L1094 332 L1126 332 Z"/><rect x="1106" y="352" width="8" height="12"/>
</g>

<!-- winding trail -->
<path d="M600 400 Q560 340 620 300 Q660 275 630 235 Q610 210 640 180" fill="none" stroke="#C9A876" stroke-width="34" stroke-linecap="round" opacity="0.85"/>
<path d="M600 400 Q560 340 620 300 Q660 275 630 235 Q610 210 640 180" fill="none" stroke="#B8935E" stroke-width="34" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.4"/>

<!-- trailside signpost -->
<g>
  <rect x="792" y="200" width="10" height="120" fill="#6B4A34"/>
  <rect x="770" y="205" width="90" height="28" rx="4" fill="#8A6642"/>
  <text x="815" y="223" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#F3E9D6">TUCKASEGEE</text>
  <rect x="778" y="238" width="70" height="24" rx="4" fill="#8A6642"/>
  <text x="813" y="254" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F3E9D6">TRAIL</text>
</g>

<!-- backpack resting against a rock -->
<g transform="translate(330,215)">
  <ellipse cx="70" cy="150" rx="90" ry="16" fill="#345B3F" opacity="0.25"/>
  <path d="M20 90 Q10 150 40 165 L110 165 Q140 150 130 90 Q130 40 75 30 Q20 40 20 90 Z" fill="#D9752E"/>
  <path d="M35 60 Q75 40 115 60 L112 130 Q75 145 38 130 Z" fill="#B85A1F"/>
  <rect x="46" y="95" width="58" height="46" rx="8" fill="#E8974B"/>
  <path d="M40 30 Q75 8 110 30" fill="none" stroke="#8C4416" stroke-width="8" stroke-linecap="round"/>
  <line x1="52" y1="35" x2="48" y2="150" stroke="#8C4416" stroke-width="7" stroke-linecap="round"/>
  <line x1="98" y1="35" x2="102" y2="150" stroke="#8C4416" stroke-width="7" stroke-linecap="round"/>
  <circle cx="75" cy="112" r="7" fill="#6B3510"/>
</g>

<!-- hiking boots -->
<g transform="translate(500,300)">
  <path d="M0 40 L0 15 Q0 5 12 5 L34 5 L34 22 L60 22 Q68 22 68 32 L68 40 Z" fill="#5B3A29"/>
  <rect x="0" y="38" width="68" height="9" rx="4" fill="#2E2016"/>
  <line x1="10" y1="8" x2="10" y2="20" stroke="#EDE0BE" stroke-width="2"/>
  <line x1="20" y1="6" x2="20" y2="20" stroke="#EDE0BE" stroke-width="2"/>
  <g transform="translate(78,0)">
    <path d="M0 40 L0 15 Q0 5 12 5 L34 5 L34 22 L60 22 Q68 22 68 32 L68 40 Z" fill="#6B4632"/>
    <rect x="0" y="38" width="68" height="9" rx="4" fill="#2E2016"/>
    <line x1="10" y1="8" x2="10" y2="20" stroke="#EDE0BE" stroke-width="2"/>
    <line x1="20" y1="6" x2="20" y2="20" stroke="#EDE0BE" stroke-width="2"/>
  </g>
</g>

<!-- title text with soft contrast panel -->
<rect x="330" y="46" width="540" height="76" rx="10" fill="#1F3A2E" opacity="0.32"/>
<text x="600" y="76" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">ACCT 351 &#183; CH. 2</text>
<text x="600" y="108" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="30" fill="#FFFFFF">Tuckasegee Trail Outfitters</text>

</svg>
