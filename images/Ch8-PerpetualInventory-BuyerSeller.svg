<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyPP" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#BFE3EA"/><stop offset="55%" stop-color="#D9EEE0"/><stop offset="100%" stop-color="#EAF3EE"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" fill="url(#skyPP)"/>
<polygon points="0,215 150,110 280,195 430,90 590,205 740,125 900,210 1060,100 1200,185 1200,250 0,250" fill="#9FAEC2"/>
<polygon points="0,240 170,155 340,235 500,145 660,240 820,165 990,235 1150,170 1200,205 1200,280 0,280" fill="#7C93A3"/>
<rect x="0" y="255" width="1200" height="30" fill="#3E6B4C"/>
<rect x="0" y="270" width="1200" height="130" fill="#8C8577"/>
<rect x="0" y="270" width="1200" height="6" fill="#4C9CB0"/>

<!-- Seller warehouse, left -->
<g transform="translate(60,190)">
  <rect x="0" y="40" width="230" height="90" fill="#B7AF9D"/>
  <polygon points="-10,40 115,-10 240,40" fill="#4A6B78"/>
  <rect x="20" y="65" width="55" height="65" fill="#4A3D2E"/>
  <rect x="95" y="65" width="34" height="26" fill="#9FD3E8"/>
  <rect x="145" y="65" width="34" height="26" fill="#9FD3E8"/>
  <rect x="185" y="90" width="30" height="40" fill="#5A4A38"/>
</g>
<text x="175" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1C3A52">SELLER</text>

<!-- Buyer store, right -->
<g transform="translate(910,205)">
  <rect x="0" y="30" width="220" height="100" fill="#C7BFAE"/>
  <rect x="0" y="30" width="220" height="12" fill="#2C5F8A"/>
  <rect x="20" y="55" width="40" height="75" fill="#4A3D2E"/>
  <rect x="75" y="55" width="30" height="28" fill="#9FD3E8"/>
  <rect x="115" y="55" width="30" height="28" fill="#9FD3E8"/>
  <rect x="155" y="55" width="30" height="28" fill="#9FD3E8"/>
</g>
<text x="1020" y="352" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1C3A52">BUYER</text>

<!-- delivery truck on the road between them -->
<g transform="translate(430,300)">
  <rect x="0" y="-40" width="130" height="55" rx="4" fill="#4C9CB0"/>
  <rect x="8" y="-33" width="55" height="24" fill="#CFE3EC"/>
  <rect x="130" y="-25" width="55" height="40" rx="3" fill="#2C5F8A"/>
  <rect x="140" y="-18" width="20" height="16" fill="#CFE3EC"/>
  <circle cx="30" cy="18" r="16" fill="#2B2B2B"/><circle cx="30" cy="18" r="6" fill="#8C939A"/>
  <circle cx="155" cy="18" r="16" fill="#2B2B2B"/><circle cx="155" cy="18" r="6" fill="#8C939A"/>
  <text x="65" y="-10" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">F.O.B.</text>
</g>

<!-- barcode scanner icon representing continuous / real-time tracking -->
<g transform="translate(640,215)">
  <rect x="0" y="0" width="66" height="50" rx="6" fill="#2C2C34"/>
  <rect x="6" y="6" width="54" height="30" rx="2" fill="#CFEFE0"/>
  <g stroke="#1B3B22" stroke-width="2.4">
    <line x1="10" y1="9" x2="10" y2="33"/><line x1="15" y1="9" x2="15" y2="33"/><line x1="22" y1="9" x2="22" y2="33"/>
    <line x1="27" y1="9" x2="27" y2="33"/><line x1="33" y1="9" x2="33" y2="33"/><line x1="40" y1="9" x2="40" y2="33"/>
    <line x1="46" y1="9" x2="46" y2="33"/><line x1="52" y1="9" x2="52" y2="33"/>
  </g>
  <rect x="24" y="40" width="18" height="10" rx="2" fill="#2C2C34"/>
  <circle cx="33" cy="-6" r="4" fill="#4C9CB0"/>
</g>
<text x="673" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1C3A52">TRACKED IN</text>
<text x="673" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1C3A52">REAL TIME</text>

<rect x="260" y="30" width="680" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">ACCT 351 &#183; CH. 8</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="25" fill="#FFFFFF">Perpetual Inventory — Buyer &amp; Seller</text>
</svg>
