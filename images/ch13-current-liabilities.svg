<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyBio" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#BFE3EA"/>
    <stop offset="55%" stop-color="#D9EEE0"/>
    <stop offset="100%" stop-color="#EAF3EE"/>
  </linearGradient>
  <linearGradient id="riverBio" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#6FB6C9"/>
    <stop offset="100%" stop-color="#4C93A8"/>
  </linearGradient>
  <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#8FE3A0"/>
    <stop offset="100%" stop-color="#3FAE63"/>
  </linearGradient>
</defs>

<rect width="1200" height="400" fill="url(#skyBio)"/>

<!-- far mountains, Nantahala Gorge backdrop -->
<polygon points="0,220 150,110 280,200 430,90 590,210 740,130 900,215 1060,105 1200,190 1200,260 0,260" fill="#9FAEC2"/>
<polygon points="0,250 170,160 340,245 500,150 660,250 820,170 990,245 1150,175 1200,210 1200,290 0,290" fill="#7C93A3"/>

<!-- ground -->
<rect x="0" y="270" width="1200" height="130" fill="#4C7A5B"/>
<path d="M0 270 Q200 250 400 272 Q600 292 800 268 Q1000 248 1200 274 L1200 400 L0 400 Z" fill="#3E6B4C"/>

<!-- the Nantahala river cutting through the gorge -->
<path d="M0 320 Q220 300 400 322 Q560 340 700 316 Q860 292 1000 314 Q1100 328 1200 312 L1200 400 L0 400 Z" fill="url(#riverBio)"/>
<path d="M40 322 Q140 314 240 324" fill="none" stroke="#EAF7FA" stroke-width="4" opacity="0.55"/>
<path d="M760 312 Q840 300 920 314" fill="none" stroke="#EAF7FA" stroke-width="4" opacity="0.55"/>
<path d="M1000 316 Q1070 306 1150 318" fill="none" stroke="#EAF7FA" stroke-width="4" opacity="0.5"/>

<!-- pine trees along the bank -->
<g fill="#2F5A3D">
  <path d="M90 280 L72 316 L108 316 Z"/><path d="M90 266 L76 296 L104 296 Z"/><rect x="86" y="316" width="8" height="12"/>
  <path d="M1130 274 L1112 310 L1148 310 Z"/><path d="M1130 260 L1116 290 L1144 290 Z"/><rect x="1126" y="310" width="8" height="12"/>
</g>

<!-- biotech research building on the far bank -->
<g transform="translate(760,195)">
  <rect x="0" y="35" width="180" height="60" fill="#D7DEE3"/>
  <rect x="0" y="35" width="180" height="10" fill="#AAB6C0"/>
  <g fill="#7FA9C9">
    <rect x="10" y="50" width="20" height="18"/><rect x="38" y="50" width="20" height="18"/><rect x="66" y="50" width="20" height="18"/>
    <rect x="94" y="50" width="20" height="18"/><rect x="122" y="50" width="20" height="18"/><rect x="150" y="50" width="20" height="18"/>
    <rect x="10" y="74" width="20" height="18"/><rect x="38" y="74" width="20" height="18"/><rect x="66" y="74" width="20" height="18"/>
    <rect x="94" y="74" width="20" height="18"/><rect x="122" y="74" width="20" height="18"/><rect x="150" y="74" width="20" height="18"/>
  </g>
  <rect x="70" y="0" width="14" height="35" fill="#AAB6C0"/>
  <rect x="66" y="-10" width="22" height="12" rx="2" fill="#9AA6B0"/>
</g>

<!-- DNA double helix motif floating above the water -->
<g transform="translate(590,125)" stroke-linecap="round">
  <path d="M0 0 Q20 20 0 40 Q-20 60 0 80 Q20 100 0 120" fill="none" stroke="#3E8C5C" stroke-width="4"/>
  <path d="M0 0 Q-20 20 0 40 Q20 60 0 80 Q-20 100 0 120" fill="none" stroke="#6E3FA3" stroke-width="4"/>
  <line x1="-10" y1="10" x2="10" y2="10" stroke="#A8935C" stroke-width="3"/>
  <line x1="-14" y1="40" x2="14" y2="40" stroke="#A8935C" stroke-width="3"/>
  <line x1="-10" y1="70" x2="10" y2="70" stroke="#A8935C" stroke-width="3"/>
  <line x1="-14" y1="100" x2="14" y2="100" stroke="#A8935C" stroke-width="3"/>
</g>

<!-- lab flask with bubbling chemical product, foreground -->
<g transform="translate(120,215)">
  <path d="M20 0 L20 24 L2 66 Q0 76 12 76 L48 76 Q60 76 58 66 L40 24 L40 0 Z" fill="#DCEAF0" opacity="0.85"/>
  <path d="M8 60 Q30 46 52 60 L58 66 Q60 76 48 76 L12 76 Q0 76 2 66 Z" fill="url(#flaskLiquid)"/>
  <rect x="16" y="-4" width="28" height="8" rx="2" fill="#8C939A"/>
  <circle cx="18" cy="55" r="3" fill="#EAF7EA" opacity="0.8"/>
  <circle cx="30" cy="48" r="2.4" fill="#EAF7EA" opacity="0.8"/>
  <circle cx="42" cy="58" r="2.8" fill="#EAF7EA" opacity="0.8"/>
</g>

<!-- refundable storage container crates, referencing the chemical-container deposits in the problem -->
<g transform="translate(220,258)">
  <rect x="0" y="0" width="46" height="46" rx="3" fill="#B0925C"/>
  <rect x="6" y="6" width="34" height="34" rx="2" fill="none" stroke="#F1E9D6" stroke-width="2"/>
  <rect x="60" y="14" width="38" height="32" rx="3" fill="#8C6642"/>
  <rect x="65" y="19" width="28" height="22" rx="2" fill="none" stroke="#F1E9D6" stroke-width="2"/>
</g>

<!-- title text with soft contrast panel, matching the assignment-card title treatment -->
<rect x="330" y="30" width="540" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">ACCT 352 &#183; CH. 13</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="28" fill="#FFFFFF">Nantahala BioSciences</text>

</svg>
