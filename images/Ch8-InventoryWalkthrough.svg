  <rect x="0" y="20" width="60" height="55" rx="3" fill="#B0925C"/>
  <rect x="6" y="26" width="48" height="43" rx="2" fill="none" stroke="#F1E9D6" stroke-width="2"/>
  <g transform="translate(18,-14)">
