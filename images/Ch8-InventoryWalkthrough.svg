    <line x1="7" y1="38" x2="35" y2="38" stroke="#8C6642" stroke-width="1.6"/>
    <path d="M6 15 L10 19 L16 10" fill="none" stroke="#3E8C5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
