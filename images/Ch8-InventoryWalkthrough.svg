  <g transform="translate(70,368)"><circle r="15" fill="#3E8C5C"/><path d="M-6 0 L-1 5 L7 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
