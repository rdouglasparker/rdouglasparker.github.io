<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="wall2" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#E2E8ED"/>
    <stop offset="100%" stop-color="#F0F2EE"/>
  </linearGradient>
</defs>

<rect width="1200" height="400" fill="url(#wall2)"/>
<rect x="0" y="300" width="1200" height="100" fill="#7C838C"/>
<rect x="0" y="300" width="1200" height="100" fill="#666D75" opacity="0.35"/>

<!-- pegboard shelf with component bins -->
<g>
  <rect x="200" y="70" width="440" height="230" fill="#4A5560"/>
  <g fill="#3A4550">
    <circle cx="220" cy="90" r="3"/><circle cx="260" cy="90" r="3"/><circle cx="300" cy="90" r="3"/><circle cx="340" cy="90" r="3"/><circle cx="380" cy="90" r="3"/><circle cx="420" cy="90" r="3"/><circle cx="460" cy="90" r="3"/><circle cx="500" cy="90" r="3"/><circle cx="540" cy="90" r="3"/><circle cx="580" cy="90" r="3"/><circle cx="620" cy="90" r="3"/>
  </g>
  <rect x="212" y="82" width="416" height="60" fill="#3A4550"/>
  <rect x="212" y="150" width="416" height="60" fill="#3A4550"/>
  <rect x="212" y="218" width="416" height="60" fill="#3A4550"/>

  <!-- top: component bins -->
  <rect x="222" y="94" width="70" height="44" rx="3" fill="#F4EFDF" stroke="#C9C2AE" stroke-width="2"/>
  <text x="257" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#5A5647">RESISTORS</text>
  <rect x="300" y="94" width="70" height="44" rx="3" fill="#F4EFDF" stroke="#C9C2AE" stroke-width="2"/>
  <text x="335" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#5A5647">CAPACITORS</text>
  <rect x="378" y="94" width="70" height="44" rx="3" fill="#F4EFDF" stroke="#C9C2AE" stroke-width="2"/>
  <text x="413" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#5A5647">DIODES</text>
  <rect x="456" y="94" width="46" height="44" rx="3" fill="#2E2E2E"/>
  <rect x="510" y="94" width="46" height="44" rx="3" fill="#2E2E2E"/>
  <rect x="564" y="94" width="60" height="44" rx="3" fill="#F4EFDF" stroke="#C9C2AE" stroke-width="2"/>
  <text x="594" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#5A5647">ICs</text>

  <!-- middle: wire spools -->
  <circle cx="248" cy="182" r="24" fill="#D9752E"/>
  <circle cx="248" cy="182" r="9" fill="#8C4416"/>
  <circle cx="304" cy="182" r="24" fill="#4A6FA5"/>
  <circle cx="304" cy="182" r="9" fill="#2E4666"/>
  <circle cx="360" cy="182" r="24" fill="#3E8C5C"/>
  <circle cx="360" cy="182" r="9" fill="#265636"/>
  <rect x="410" y="164" width="160" height="40" rx="4" fill="#F4EFDF" stroke="#C9C2AE" stroke-width="2"/>
  <text x="490" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#5A5647">HOOK-UP WIRE</text>

  <!-- bottom: parts boxes -->
  <rect x="222" y="230" width="90" height="44" rx="3" fill="#C7CDD3" stroke="#8E969E" stroke-width="2"/>
  <line x1="222" y1="244" x2="312" y2="244" stroke="#8E969E" stroke-width="2"/>
  <rect x="322" y="230" width="90" height="44" rx="3" fill="#C7CDD3" stroke="#8E969E" stroke-width="2"/>
  <line x1="322" y1="244" x2="412" y2="244" stroke="#8E969E" stroke-width="2"/>
  <rect x="430" y="230" width="90" height="44" rx="3" fill="#C7CDD3" stroke="#8E969E" stroke-width="2"/>
  <line x1="430" y1="244" x2="520" y2="244" stroke="#8E969E" stroke-width="2"/>
  <rect x="536" y="222" width="70" height="52" rx="3" fill="#F4EFDF" stroke="#C9C2AE" stroke-width="2"/>
  <text x="571" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#5A5647">FUSES</text>
</g>

<!-- workbench with PCB, scope, soldering iron -->
<g>
  <rect x="690" y="292" width="330" height="18" rx="3" fill="#5A5650"/>
  <rect x="702" y="310" width="16" height="68" fill="#403D38"/>
  <rect x="990" y="310" width="16" height="68" fill="#403D38"/>

  <!-- PCB -->
  <g transform="translate(715,236)">
    <rect x="0" y="0" width="100" height="66" rx="4" fill="#1F6B3D"/>
    <g stroke="#C9A227" stroke-width="1.5" fill="none" opacity="0.85">
      <path d="M8 10 H50 V30 H80"/>
      <path d="M8 26 H30 V50 H70"/>
      <path d="M20 56 H90 V16"/>
    </g>
    <rect x="34" y="20" width="26" height="16" fill="#111"/>
    <circle cx="14" cy="14" r="3" fill="#C9A227"/>
    <circle cx="88" cy="46" r="3" fill="#C9A227"/>
    <rect x="66" y="42" width="14" height="14" fill="#333"/>
  </g>

  <!-- oscilloscope -->
  <g transform="translate(838,206)">
    <rect x="0" y="0" width="112" height="86" rx="6" fill="#2A2E33"/>
    <rect x="9" y="9" width="94" height="56" rx="3" fill="#0E2A1E"/>
    <polyline points="12,50 26,30 40,55 54,20 68,48 82,34 98,42" fill="none" stroke="#5FDC8C" stroke-width="2.5"/>
    <circle cx="18" cy="76" r="4" fill="#777"/>
    <circle cx="34" cy="76" r="4" fill="#777"/>
    <circle cx="50" cy="76" r="4" fill="#777"/>
  </g>

  <!-- soldering iron on stand -->
  <g transform="translate(965,232)">
    <ellipse cx="30" cy="70" rx="34" ry="8" fill="#8A6642" opacity="0.5"/>
    <path d="M30 62 Q10 62 6 66" stroke="#3A3A3A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="4" y="20" width="14" height="46" rx="6" fill="#D9752E" transform="rotate(28 11 43)"/>
    <line x1="22" y1="16" x2="34" y2="4" stroke="#B0B0B0" stroke-width="4" stroke-linecap="round"/>
  </g>
</g>

<!-- title text with soft contrast panel -->
<rect x="300" y="18" width="600" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="48" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#E4EEF0">ACCT 351 &#183; CH. 3</text>
<text x="600" y="80" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="30" fill="#FFFFFF">Pisgah Electronics Corp.</text>

</svg>
