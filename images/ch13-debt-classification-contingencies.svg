<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyHarv" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#F5D9A0"/>
    <stop offset="55%" stop-color="#EFE3BE"/>
    <stop offset="100%" stop-color="#E7EFDB"/>
  </linearGradient>
  <linearGradient id="fieldHarv" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#C9A64A"/>
    <stop offset="100%" stop-color="#A8863A"/>
  </linearGradient>
</defs>

<rect width="1200" height="400" fill="url(#skyHarv)"/>
<circle cx="1020" cy="95" r="42" fill="#FBE29A" opacity="0.9"/>

<!-- far mountains -->
<polygon points="0,215 150,110 280,195 430,90 590,205 740,125 900,210 1060,100 1200,185 1200,250 0,250" fill="#9FAEC2"/>
<polygon points="0,240 170,155 340,235 500,145 660,240 820,165 990,235 1150,170 1200,205 1200,280 0,280" fill="#7C93A3"/>

<!-- tree line at the base of the mountains -->
<rect x="0" y="255" width="1200" height="30" fill="#3E6B4C"/>

<!-- wheat field, rows receding toward the tree line -->
<rect x="0" y="270" width="1200" height="130" fill="url(#fieldHarv)"/>
<g stroke="#8C6F2E" stroke-width="2" opacity="0.55">
  <line x1="0" y1="290" x2="1200" y2="284"/>
  <line x1="0" y1="310" x2="1200" y2="302"/>
  <line x1="0" y1="332" x2="1200" y2="322"/>
  <line x1="0" y1="356" x2="1200" y2="344"/>
  <line x1="0" y1="382" x2="1200" y2="368"/>
</g>
<g stroke="#E9C877" stroke-width="3" opacity="0.6">
  <path d="M40 400 L44 300"/><path d="M60 400 L64 300"/><path d="M80 400 L84 300"/>
  <path d="M1080 400 L1084 300"/><path d="M1100 400 L1104 300"/><path d="M1120 400 L1124 300"/>
</g>

<!-- grain silo cluster (manufacturing / storage) -->
<g transform="translate(920,235)">
  <rect x="0" y="20" width="46" height="80" rx="23" fill="#B4BEC6"/>
  <ellipse cx="23" cy="20" rx="23" ry="10" fill="#8C939A"/>
  <rect x="56" y="35" width="38" height="65" rx="19" fill="#9FABB4"/>
  <ellipse cx="75" cy="35" rx="19" ry="8" fill="#7C858C"/>
  <rect x="18" y="100" width="10" height="14" fill="#6B7178"/>
  <rect x="70" y="100" width="10" height="10" fill="#6B7178"/>
</g>

<!-- barn / equipment shed -->
<g transform="translate(60,235)">
  <polygon points="0,45 55,5 110,45" fill="#8C3015"/>
  <rect x="6" y="45" width="98" height="55" fill="#B3401E"/>
  <rect x="42" y="66" width="26" height="34" fill="#5A2410"/>
  <rect x="14" y="55" width="18" height="18" fill="#E9DDC4"/>
  <rect x="78" y="55" width="18" height="18" fill="#E9DDC4"/>
  <polygon points="0,45 110,45 110,50 0,50" fill="#5A2410"/>
</g>

<!-- combine harvester working the field, foreground -->
<g transform="translate(430,300)">
  <!-- header / cutting reel -->
  <rect x="-38" y="18" width="52" height="26" rx="4" fill="#C8302A"/>
  <circle cx="-30" cy="31" r="7" fill="#8C1F1B"/>
  <circle cx="-12" cy="31" r="7" fill="#8C1F1B"/>
  <!-- body -->
  <rect x="10" y="-14" width="90" height="46" rx="6" fill="#E0A82C"/>
  <rect x="18" y="-30" width="28" height="20" rx="3" fill="#CFE3EC"/>
  <rect x="60" y="-6" width="30" height="16" rx="2" fill="#8C6E1E"/>
  <!-- grain tank -->
  <rect x="70" y="-30" width="34" height="20" rx="3" fill="#F0C24A"/>
  <!-- wheels -->
  <circle cx="30" cy="42" r="18" fill="#2B2B2B"/>
  <circle cx="30" cy="42" r="7" fill="#8C939A"/>
  <circle cx="92" cy="42" r="12" fill="#2B2B2B"/>
  <circle cx="92" cy="42" r="5" fill="#8C939A"/>
</g>

<!-- cut wheat trail behind the combine -->
<rect x="0" y="345" width="430" height="55" fill="#DCC98A" opacity="0.55"/>

<!-- title text with soft contrast panel, matching the assignment-card title treatment -->
<rect x="300" y="30" width="600" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">ACCT 352 &#183; CH. 13</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="28" fill="#FFFFFF">Tuckasegee Harvester Corporation</text>

</svg>
