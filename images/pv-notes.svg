<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyPV" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#F6D9A0"/>
    <stop offset="50%" stop-color="#E8C9C0"/>
    <stop offset="100%" stop-color="#E4DCEF"/>
  </linearGradient>
  <radialGradient id="sunPV" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFF3D0"/>
    <stop offset="55%" stop-color="#F0C24A"/>
    <stop offset="100%" stop-color="#D6A233"/>
  </radialGradient>
</defs>

<rect width="1200" height="400" fill="url(#skyPV)"/>

<!-- far mountains -->
<polygon points="0,225 150,120 280,205 430,100 590,215 740,135 900,220 1060,110 1200,195 1200,260 0,260" fill="#A79CC0"/>
<polygon points="0,250 170,165 340,245 500,155 660,250 820,175 990,245 1150,180 1200,212 1200,290 0,290" fill="#83739F"/>

<!-- ground -->
<rect x="0" y="270" width="1200" height="130" fill="#4C7A5B"/>
<path d="M0 270 Q200 250 400 272 Q600 292 800 268 Q1000 248 1200 274 L1200 400 L0 400 Z" fill="#3E6B4C"/>

<!-- pine trees, low and far, for scenery continuity -->
<g fill="#2F5A3D">
  <path d="M80 300 L60 340 L100 340 Z"/><path d="M80 285 L64 320 L96 320 Z"/><rect x="76" y="340" width="8" height="12"/>
  <path d="M1130 292 L1110 332 L1150 332 Z"/><path d="M1130 277 L1114 312 L1146 312 Z"/><rect x="1126" y="332" width="8" height="12"/>
</g>

<!-- winding trail rising left to right, toward the summit payoff -->
<path d="M40 375 Q220 355 340 330 Q460 305 560 275 Q700 235 820 195 Q900 168 985 128"
      fill="none" stroke="#EFE6D2" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.9"/>

<!-- mountain peak the trail leads to -->
<polygon points="900,270 985,120 1075,270" fill="#6E93A8"/>
<polygon points="945,205 985,120 1030,205" fill="#EFF3F6"/>

<!-- the payoff: a glowing coin/sun at the summit representing the future value -->
<circle cx="985" cy="108" r="34" fill="url(#sunPV)"/>
<circle cx="985" cy="108" r="34" fill="none" stroke="#B0803A" stroke-width="2" opacity="0.6"/>
<text x="985" y="118" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-weight="700" font-size="28" fill="#6B4A18">$</text>

<!-- timeline markers along the trail: today, year 1, year 2, year 3 -->
<g font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#3A2F4E">
  <g transform="translate(40,375)">
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#5A4F72" stroke-width="4"/>
    <circle cx="0" cy="-30" r="6" fill="#B3401E"/>
    <text x="0" y="20" text-anchor="middle">TODAY</text>
  </g>
  <g transform="translate(340,330)">
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#5A4F72" stroke-width="4"/>
    <circle cx="0" cy="-28" r="6" fill="#8C5FA8"/>
    <text x="0" y="20" text-anchor="middle">YR 1</text>
  </g>
  <g transform="translate(560,275)">
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#5A4F72" stroke-width="4"/>
    <circle cx="0" cy="-28" r="7" fill="#6E3FA3"/>
    <text x="0" y="20" text-anchor="middle">YR 2</text>
  </g>
  <g transform="translate(820,195)">
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#5A4F72" stroke-width="4"/>
    <circle cx="0" cy="-26" r="8" fill="#38195A"/>
    <text x="0" y="18" text-anchor="middle">YR 3</text>
  </g>
</g>

<!-- discount arrow curving back from the summit to today, echoing "present value" -->
<path d="M950 150 Q560 60 90 340" fill="none" stroke="#38195A" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.55" marker-end="url(#arrowPV)"/>
<defs>
  <marker id="arrowPV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#38195A" opacity="0.7"/>
  </marker>
</defs>

<!-- wooden trail sign, matching the style used across other topic cards -->
<g transform="translate(140,225)">
  <rect x="9" y="0" width="10" height="110" fill="#6B4A34"/>
  <rect x="-18" y="6" width="98" height="26" rx="4" fill="#8A6642"/>
  <text x="31" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">TIME VALUE</text>
  <rect x="-2" y="38" width="66" height="24" rx="4" fill="#8A6642"/>
  <text x="29" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">OF MONEY</text>
</g>

<!-- title text with soft contrast panel, matching the assignment-card title treatment -->
<rect x="300" y="30" width="600" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">TOPIC NOTES &#183; TIME VALUE OF MONEY</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="28" fill="#FFFFFF">Present Value Concepts</text>

</svg>
