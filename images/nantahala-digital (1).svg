<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="wallNAN" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#E4E9EC"/>
    <stop offset="100%" stop-color="#F3F0E6"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" fill="url(#wallNAN)"/>
<rect x="0" y="300" width="1200" height="100" fill="#B98A55"/>
<rect x="0" y="300" width="1200" height="100" fill="#A97A46" opacity="0.35"/>
<g stroke="#8C6A3E" stroke-width="1" opacity="0.4">
  <line x1="0" y1="330" x2="1200" y2="330"/>
  <line x1="0" y1="360" x2="1200" y2="360"/>
</g>

<!-- retail box behind the tablet -->
<g transform="translate(230,150)">
  <rect x="0" y="0" width="150" height="150" rx="6" fill="#4A6FA5"/>
  <rect x="0" y="0" width="150" height="34" fill="#3A5A8A"/>
  <text x="75" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#F1E9D6">TRAILRUNNER</text>
  <rect x="24" y="56" width="102" height="76" rx="6" fill="#2E4666"/>
  <rect x="34" y="66" width="82" height="56" rx="3" fill="#8FB6E0"/>
</g>

<!-- tablet leaning in front of box -->
<g transform="translate(330,190) rotate(6)">
  <rect x="0" y="0" width="90" height="130" rx="8" fill="#222"/>
  <rect x="6" y="8" width="78" height="106" rx="3" fill="#8FB6E0"/>
  <circle cx="45" cy="120" r="3" fill="#555"/>
</g>

<!-- coupon ticket -->
<g transform="translate(520,190)">
  <path d="M0 10 Q0 0 10 0 L130 0 Q140 0 140 10 L140 70 Q140 80 130 80 L10 80 Q0 80 0 70 Z" fill="#FFFDF6" stroke="#C9BB8E" stroke-width="2"/>
  <circle cx="0" cy="40" r="8" fill="#F3F0E6" stroke="#C9BB8E" stroke-width="2"/>
  <circle cx="140" cy="40" r="8" fill="#F3F0E6" stroke="#C9BB8E" stroke-width="2"/>
  <line x1="16" y1="40" x2="124" y2="40" stroke="#C9BB8E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="70" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38195A">COUPON</text>
  <text x="70" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#B3401E">PageFinder $180</text>
</g>

<!-- warranty badge -->
<g transform="translate(700,180)">
  <path d="M50 0 L96 18 L96 55 Q96 90 50 108 Q4 90 4 55 L4 18 Z" fill="#3E8C5C" stroke="#2C6B44" stroke-width="3"/>
  <text x="50" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F1E9D6">6-MO</text>
  <text x="50" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#F1E9D6">WARRANTY</text>
</g>

<!-- allocation receipt -->
<g transform="translate(840,150)">
  <rect x="0" y="0" width="150" height="180" rx="6" fill="#FFFDF6" stroke="#C9BB8E" stroke-width="2"/>
  <rect x="0" y="0" width="150" height="30" rx="6" fill="#2E5F4E"/>
  <text x="75" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F3E9D6">ALLOCATION</text>
  <line x1="16" y1="48" x2="134" y2="48" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="68" x2="112" y2="68" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="88" x2="134" y2="88" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="108" x2="112" y2="108" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="134" x2="124" y2="134" stroke="#2E5F4E" stroke-width="6"/>
</g>

<!-- title text with soft contrast panel -->
<rect x="320" y="18" width="560" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="48" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#E4EEF0">ACCT 351 &#183; ASC 606</text>
<text x="600" y="80" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="30" fill="#FFFFFF">Nantahala Digital</text>

</svg>
