<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="skyP" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#F5D9A0"/><stop offset="55%" stop-color="#EFE3BE"/><stop offset="100%" stop-color="#E7EFDB"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" fill="url(#skyP)"/>
<polygon points="0,215 150,110 280,195 430,90 590,205 740,125 900,210 1060,100 1200,185 1200,250 0,250" fill="#9FAEC2"/>
<polygon points="0,240 170,155 340,235 500,145 660,240 820,165 990,235 1150,170 1200,205 1200,280 0,280" fill="#7C93A3"/>
<rect x="0" y="255" width="1200" height="30" fill="#3E6B4C"/>
<rect x="0" y="270" width="1200" height="130" fill="#8C8577"/>
<rect x="0" y="270" width="1200" height="6" fill="#C8A24A"/>

<!-- Seller warehouse, left -->
<g transform="translate(60,190)">
  <rect x="0" y="40" width="230" height="90" fill="#B7AF9D"/>
  <polygon points="-10,40 115,-10 240,40" fill="#7A5B3D"/>
  <rect x="20" y="65" width="55" height="65" fill="#4A3D2E"/>
  <rect x="95" y="65" width="34" height="26" fill="#9FD3E8"/>
  <rect x="145" y="65" width="34" height="26" fill="#9FD3E8"/>
  <rect x="185" y="90" width="30" height="40" fill="#5A4A38"/>
</g>
<text x="175" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#3A2F4E">SELLER</text>

<!-- Buyer store, right -->
<g transform="translate(910,205)">
  <rect x="0" y="30" width="220" height="100" fill="#C7BFAE"/>
  <rect x="0" y="30" width="220" height="12" fill="#8C6642"/>
  <rect x="20" y="55" width="40" height="75" fill="#4A3D2E"/>
  <rect x="75" y="55" width="30" height="28" fill="#9FD3E8"/>
  <rect x="115" y="55" width="30" height="28" fill="#9FD3E8"/>
  <rect x="155" y="55" width="30" height="28" fill="#9FD3E8"/>
</g>
<text x="1020" y="352" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#3A2F4E">BUYER</text>

<!-- delivery truck on the road between them -->
<g transform="translate(430,300)">
  <rect x="0" y="-40" width="130" height="55" rx="4" fill="#E0A82C"/>
  <rect x="8" y="-33" width="55" height="24" fill="#CFE3EC"/>
  <rect x="130" y="-25" width="55" height="40" rx="3" fill="#C8A24A"/>
  <rect x="140" y="-18" width="20" height="16" fill="#CFE3EC"/>
  <circle cx="30" cy="18" r="16" fill="#2B2B2B"/><circle cx="30" cy="18" r="6" fill="#8C939A"/>
  <circle cx="155" cy="18" r="16" fill="#2B2B2B"/><circle cx="155" cy="18" r="6" fill="#8C939A"/>
  <text x="65" y="-10" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#5A4415">F.O.B.</text>
</g>

<!-- calendar icon representing "counted at period end" -->
<g transform="translate(640,205)">
  <rect x="0" y="8" width="70" height="60" rx="6" fill="#EFE6D2" stroke="#8C6642" stroke-width="3"/>
  <rect x="0" y="8" width="70" height="16" fill="#B3401E"/>
  <rect x="14" y="0" width="6" height="16" fill="#6B4A34"/>
  <rect x="50" y="0" width="6" height="16" fill="#6B4A34"/>
  <g fill="#8C6642">
    <circle cx="14" cy="38" r="3"/><circle cx="28" cy="38" r="3"/><circle cx="42" cy="38" r="3"/><circle cx="56" cy="38" r="3"/>
    <circle cx="14" cy="52" r="3"/><circle cx="28" cy="52" r="3"/><circle cx="42" cy="52" r="3"/>
  </g>
  <circle cx="56" cy="52" r="7" fill="#3E8C5C"/>
  <path d="M53 52 L55.5 54.5 L60 49" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="675" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3A2F4E">COUNTED AT</text>
<text x="675" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3A2F4E">PERIOD END</text>

<rect x="270" y="30" width="660" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="60" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#F3E9D6">ACCT 351 &#183; INVENTORY</text>
<text x="600" y="92" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="25" fill="#FFFFFF">Periodic Inventory — Buyer &amp; Seller</text>
</svg>
