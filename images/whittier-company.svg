<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="wallWHT" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#E4E9EC"/>
    <stop offset="100%" stop-color="#F3F0E6"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" fill="url(#wallWHT)"/>
<rect x="0" y="300" width="1200" height="100" fill="#B98A55"/>
<rect x="0" y="300" width="1200" height="100" fill="#A97A46" opacity="0.35"/>
<g stroke="#8C6A3E" stroke-width="1" opacity="0.4">
  <line x1="0" y1="330" x2="1200" y2="330"/>
  <line x1="0" y1="360" x2="1200" y2="360"/>
</g>

<!-- report 1: income statement -->
<g transform="translate(430,120) rotate(-4)">
  <rect x="0" y="0" width="160" height="200" rx="6" fill="#FFFDF6" stroke="#C9BB8E" stroke-width="2"/>
  <rect x="0" y="0" width="160" height="32" rx="6" fill="#2E5F4E"/>
  <text x="80" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F3E9D6">INCOME STATEMENT</text>
  <line x1="16" y1="54" x2="144" y2="54" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="74" x2="124" y2="74" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="94" x2="144" y2="94" stroke="#2E5F4E" stroke-width="5"/>
  <line x1="16" y1="118" x2="124" y2="118" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="144" x2="136" y2="144" stroke="#D8CBA0" stroke-width="6"/>
  <line x1="16" y1="168" x2="140" y2="168" stroke="#2E5F4E" stroke-width="6"/>
</g>

<!-- report 2: comprehensive income, overlapping -->
<g transform="translate(590,145) rotate(6)">
  <rect x="0" y="0" width="160" height="200" rx="6" fill="#FFFDF6" stroke="#C9BB8E" stroke-width="2"/>
  <rect x="0" y="0" width="160" height="32" rx="6" fill="#4A6FA5"/>
  <text x="80" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F3E9D6">COMPREHENSIVE INCOME</text>
  <line x1="16" y1="54" x2="144" y2="54" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="74" x2="120" y2="74" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="94" x2="120" y2="94" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="16" y1="118" x2="140" y2="118" stroke="#4A6FA5" stroke-width="6"/>
</g>

<!-- calculator -->
<g transform="translate(345,255)">
  <rect x="0" y="0" width="66" height="50" rx="5" fill="#3A3A3A"/>
  <rect x="6" y="6" width="54" height="14" rx="2" fill="#B7D8B0"/>
  <g fill="#666">
    <rect x="8" y="26" width="10" height="8" rx="1"/>
    <rect x="22" y="26" width="10" height="8" rx="1"/>
    <rect x="36" y="26" width="10" height="8" rx="1"/>
    <rect x="50" y="26" width="10" height="8" rx="1"/>
    <rect x="8" y="38" width="10" height="8" rx="1"/>
    <rect x="22" y="38" width="10" height="8" rx="1"/>
    <rect x="36" y="38" width="10" height="8" rx="1"/>
    <rect x="50" y="38" width="10" height="8" rx="1"/>
  </g>
</g>

<!-- reading glasses -->
<g transform="translate(800,270)" fill="none" stroke="#5A5650" stroke-width="4">
  <circle cx="20" cy="20" r="20"/>
  <circle cx="70" cy="20" r="20"/>
  <line x1="40" y1="18" x2="50" y2="18"/>
  <line x1="0" y1="16" x2="-16" y2="8"/>
  <line x1="90" y1="16" x2="106" y2="8"/>
</g>

<!-- title text with soft contrast panel -->
<rect x="330" y="18" width="540" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="48" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#E4EEF0">ACCT 351 &#183; CH. 4</text>
<text x="600" y="80" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="30" fill="#FFFFFF">Whittier Company</text>

</svg>
