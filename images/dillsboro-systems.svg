<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="wallDBS" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#E4E9EC"/>
    <stop offset="100%" stop-color="#F3F0E6"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" fill="url(#wallDBS)"/>
<rect x="0" y="300" width="1200" height="100" fill="#B98A55"/>
<rect x="0" y="300" width="1200" height="100" fill="#A97A46" opacity="0.35"/>
<g stroke="#8C6A3E" stroke-width="1" opacity="0.4">
  <line x1="0" y1="330" x2="1200" y2="330"/>
  <line x1="0" y1="360" x2="1200" y2="360"/>
</g>

<!-- scattered loose papers, left side -->
<g transform="translate(255,150) rotate(-13)">
  <rect x="0" y="0" width="120" height="150" rx="4" fill="#FFFDF6" stroke="#D9CBA0" stroke-width="2"/>
  <line x1="16" y1="26" x2="104" y2="26" stroke="#D9CBA0" stroke-width="4"/>
  <line x1="16" y1="44" x2="90" y2="44" stroke="#D9CBA0" stroke-width="4"/>
  <line x1="16" y1="62" x2="104" y2="62" stroke="#D9CBA0" stroke-width="4"/>
  <line x1="16" y1="80" x2="80" y2="80" stroke="#D9CBA0" stroke-width="4"/>
</g>
<g transform="translate(300,190) rotate(9)">
  <rect x="0" y="0" width="120" height="150" rx="4" fill="#FFFDF6" stroke="#D9CBA0" stroke-width="2"/>
  <line x1="16" y1="26" x2="104" y2="26" stroke="#D9CBA0" stroke-width="4"/>
  <line x1="16" y1="44" x2="90" y2="44" stroke="#D9CBA0" stroke-width="4"/>
  <line x1="16" y1="62" x2="104" y2="62" stroke="#D9CBA0" stroke-width="4"/>
</g>
<!-- red circle mark, like an editor's pen mark -->
<ellipse cx="345" cy="260" rx="26" ry="16" fill="none" stroke="#B3401E" stroke-width="4" transform="rotate(9 345 260)"/>

<!-- arrow -->
<g stroke="#5A5650" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <line x1="470" y1="220" x2="590" y2="220"/>
  <path d="M566 198 L594 220 L566 242"/>
</g>

<!-- tidy bound report, right side -->
<g transform="translate(650,120)">
  <rect x="0" y="0" width="170" height="210" rx="6" fill="#FFFDF6" stroke="#C9BB8E" stroke-width="2"/>
  <rect x="0" y="0" width="170" height="34" rx="6" fill="#2E5F4E"/>
  <text x="85" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#F3E9D6">INCOME STATEMENT</text>
  <line x1="18" y1="58" x2="152" y2="58" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="18" y1="78" x2="130" y2="78" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="18" y1="98" x2="152" y2="98" stroke="#2E5F4E" stroke-width="5"/>
  <line x1="18" y1="122" x2="130" y2="122" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="18" y1="142" x2="152" y2="142" stroke="#2E5F4E" stroke-width="5"/>
  <line x1="18" y1="170" x2="140" y2="170" stroke="#D8CBA0" stroke-width="6"/>
  <line x1="18" y1="192" x2="150" y2="192" stroke="#2E5F4E" stroke-width="6"/>
</g>

<!-- coffee mug -->
<g transform="translate(560,270)">
  <path d="M0 10 L6 42 L44 42 L50 10 Z" fill="#4A6FA5"/>
  <ellipse cx="25" cy="10" rx="25" ry="6" fill="#5C7FB0"/>
  <path d="M50 16 Q66 16 66 28 Q66 40 50 38" fill="none" stroke="#4A6FA5" stroke-width="5"/>
</g>

<!-- pen -->
<g transform="translate(430,290) rotate(-24)">
  <rect x="0" y="0" width="70" height="9" rx="4" fill="#B3401E"/>
  <polygon points="70,0 82,4.5 70,9" fill="#38195A"/>
</g>

<!-- title text with soft contrast panel -->
<rect x="300" y="18" width="600" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="48" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#E4EEF0">ACCT 351 &#183; CH. 4</text>
<text x="600" y="80" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="26" fill="#FFFFFF">Dillsboro Systems, Incorporated</text>

</svg>
