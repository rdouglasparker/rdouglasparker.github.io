<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="wallCAN" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#E4E9EC"/>
    <stop offset="100%" stop-color="#F3F0E6"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" fill="url(#wallCAN)"/>
<rect x="0" y="300" width="1200" height="100" fill="#B98A55"/>
<rect x="0" y="300" width="1200" height="100" fill="#A97A46" opacity="0.35"/>
<g stroke="#8C6A3E" stroke-width="1" opacity="0.4">
  <line x1="0" y1="330" x2="1200" y2="330"/>
  <line x1="0" y1="360" x2="1200" y2="360"/>
</g>

<!-- three labeled trays feeding cash -->
<g transform="translate(300,150)">
  <rect x="0" y="0" width="110" height="34" rx="4" fill="#C89A5F" stroke="#8C6A3E" stroke-width="2"/>
  <text x="55" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#3A2A1A">OPERATING</text>
</g>
<g transform="translate(300,205)">
  <rect x="0" y="0" width="110" height="34" rx="4" fill="#C89A5F" stroke="#8C6A3E" stroke-width="2"/>
  <text x="55" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#3A2A1A">INVESTING</text>
</g>
<g transform="translate(300,260)">
  <rect x="0" y="0" width="110" height="34" rx="4" fill="#C89A5F" stroke="#8C6A3E" stroke-width="2"/>
  <text x="55" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#3A2A1A">FINANCING</text>
</g>

<!-- arrows into cash box -->
<g stroke="#5A5650" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M418 167 L560 205"/>
  <path d="M538 189 L562 205 L540 214"/>
  <path d="M418 222 L560 222"/>
  <path d="M540 208 L562 222 L540 236"/>
  <path d="M418 277 L560 239"/>
  <path d="M540 231 L562 239 L544 253"/>
</g>

<!-- open cash box -->
<g transform="translate(570,190)">
  <rect x="0" y="20" width="150" height="90" rx="6" fill="#8C6642"/>
  <rect x="0" y="20" width="150" height="14" fill="#6E4E2C"/>
  <rect x="16" y="40" width="118" height="55" rx="3" fill="#3E8C5C"/>
  <rect x="24" y="46" width="102" height="10" rx="2" fill="#F1E9D6"/>
  <rect x="24" y="60" width="102" height="10" rx="2" fill="#F1E9D6"/>
  <rect x="24" y="74" width="102" height="10" rx="2" fill="#F1E9D6"/>
  <circle cx="75" cy="60" r="9" fill="none" stroke="#F1E9D6" stroke-width="1.5" opacity="0.6"/>
</g>

<!-- arrow out to report -->
<g stroke="#5A5650" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <line x1="740" y1="235" x2="820" y2="235"/>
  <path d="M800 217 L822 235 L800 253"/>
</g>

<!-- statement of cash flows sheet -->
<g transform="translate(840,160)">
  <rect x="0" y="0" width="140" height="170" rx="6" fill="#FFFDF6" stroke="#C9BB8E" stroke-width="2"/>
  <rect x="0" y="0" width="140" height="30" rx="6" fill="#2E5F4E"/>
  <text x="70" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#F3E9D6">CASH FLOWS</text>
  <line x1="14" y1="48" x2="126" y2="48" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="14" y1="68" x2="106" y2="68" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="14" y1="88" x2="126" y2="88" stroke="#D8CBA0" stroke-width="4"/>
  <line x1="14" y1="112" x2="118" y2="112" stroke="#2E5F4E" stroke-width="6"/>
  <line x1="14" y1="140" x2="126" y2="140" stroke="#2E5F4E" stroke-width="6"/>
</g>

<!-- title text with soft contrast panel -->
<rect x="300" y="18" width="600" height="76" rx="10" fill="#20303A" opacity="0.42"/>
<text x="600" y="48" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#E4EEF0">ACCT 351 &#183; CH. 5</text>
<text x="600" y="80" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="30" fill="#FFFFFF">Canton Industries</text>

</svg>
