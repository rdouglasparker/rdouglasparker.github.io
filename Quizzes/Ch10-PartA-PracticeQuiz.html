<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acquisition Costs of Property, Plant, and Equipment: Practice Quiz</title>
<style>
:root{--bg:#f8fafc;--card-bg:#ffffff;--text:#0f172a;--text-muted:#475569;--primary:#1d4ed8;--primary-hover:#1e40af;--primary-light:#eff6ff;--border:#cbd5e1;--focus-ring:#0284c7;--success:#15803d;--success-bg:#f0fdf4;--success-border:#86efac;--danger:#b91c1c;--danger-bg:#fef2f2;--danger-border:#fca5a5;--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg);color:var(--text);line-height:1.6;padding:2rem 1rem}
.container{max-width:820px;margin:0 auto}
.skip-link{position:absolute;top:-40px;left:0;background:var(--primary);color:#fff;padding:8px 16px;z-index:100;text-decoration:none;font-weight:600;border-radius:0 0 4px 0}
.skip-link:focus{top:0}
header{text-align:center;margin-bottom:2rem}
h1{font-size:1.85rem;font-weight:700;color:#0f172a;margin-bottom:.5rem}
.subtitle{color:var(--text-muted);font-size:1rem}
.scoreboard-sticky{position:sticky;top:1rem;z-index:10;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.5rem;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 6px -1px rgba(0,0,0,.05)}
.score-stats{font-weight:700;font-size:1rem}
.progress-bar-container{flex:1;max-width:260px;margin:0 1.5rem;height:14px;background-color:#e2e8f0;border-radius:999px;overflow:hidden;border:1px solid #cbd5e1}
.progress-bar-fill{height:100%;width:0%;background-color:var(--primary);transition:width .3s ease}
.reset-btn{background:#fff;border:1px solid var(--border);padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--text)}
.reset-btn:hover{background-color:#f1f5f9}
.reset-btn:focus-visible,.submit-btn:focus-visible,input[type="radio"]:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.quiz-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:2rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
fieldset{border:none;margin:0;padding:0}
legend{width:100%;margin-bottom:1.25rem}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.q-badge{background:var(--primary-light);color:var(--primary);font-size:.85rem;font-weight:700;padding:.2rem .6rem;border-radius:4px}
.topic-tag{font-size:.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.question-text{font-size:1.1rem;font-weight:600;color:#0f172a;display:block;margin-top:.5rem}
.options-list{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.25rem}
.option-label{display:flex;align-items:flex-start;padding:.85rem 1rem;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;font-size:.95rem;background:#fafafa}
.option-label:hover{background:#f1f5f9;border-color:#94a3b8}
.option-label:has(input:focus-visible){outline:3px solid var(--focus-ring);outline-offset:2px}
.option-label input[type="radio"]{margin-top:.25rem;margin-right:.75rem;width:1.1rem;height:1.1rem}
.option-label.correct{background-color:var(--success-bg)!important;border-color:var(--success)!important;color:#14532d;font-weight:600}
.option-label.incorrect{background-color:var(--danger-bg)!important;border-color:var(--danger)!important;color:#7f1d1d}
.submit-btn{background-color:var(--primary);color:#fff;border:none;padding:.65rem 1.4rem;border-radius:6px;font-size:.95rem;font-weight:600;cursor:pointer}
.submit-btn:hover:not(:disabled){background-color:var(--primary-hover)}
.submit-btn:disabled{background-color:#e2e8f0;color:#64748b;cursor:not-allowed}
.feedback-box{margin-top:1.25rem;padding:1rem 1.25rem;border-radius:6px;font-size:.95rem;display:none}
.feedback-box.show{display:block}
.feedback-box.correct{background:var(--success-bg);border:1.5px solid var(--success-border);color:#14532d}
.feedback-box.incorrect{background:var(--danger-bg);border:1.5px solid var(--danger-border);color:#7f1d1d}
.feedback-explanation{margin-top:.5rem;color:#1e293b;line-height:1.55}
footer{text-align:center;margin-top:3rem;font-size:.9rem;color:var(--text-muted)}
</style>
<style id="a11y-fixes">
:focus-visible { outline: 3px solid #341f5c !important; outline-offset: 2px !important; box-shadow: 0 0 0 5px #ffffff !important; }
.a11y-scroll { overflow-x: auto; max-width: 100%; }
.table-scroll, .a11y-scroll { position: relative; }
.a11y-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="container">
<header>
<h1>Acquisition Costs of Property, Plant, and Equipment: Practice Quiz</h1>
<p class="subtitle">Ten questions on capitalizing costs, lump-sum purchases, and asset retirement obligations</p>
</header>
<main id="main-content">
<div class="scoreboard-sticky" aria-label="Quiz status summary">
<div class="score-stats" id="scoreDisplay" aria-live="polite">Score: 0 / 10 (0%)</div>
<div class="progress-bar-container" role="progressbar" id="progressBarWrapper" aria-label="Quiz completion progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-bar-fill" id="progressBar"></div></div>
<button type="button" class="reset-btn" onclick="resetQuiz()">Reset Quiz</button>
</div>
<div id="quizContainer"></div>
</main>
<footer><p>Acquisition Costs of PP&amp;E &middot; ACCT 351 &middot; Western Carolina University</p></footer>
</div>
<script>
const quizData = [
 {
  "id": 1,
  "topic": "Capitalization",
  "question": "Which cost is NOT capitalized as part of the cost of a newly purchased machine?",
  "options": [
   "Freight paid to deliver it",
   "Installation and calibration",
   "Training the employees who will operate it",
   "Insurance while the machine is in transit"
  ],
  "answer": 2,
  "explanation": "Costs necessary to get the asset ready for use (freight, transit insurance, installation, testing) are capitalized. Employee training is hard to tie to the asset and benefits people, so it is expensed."
 },
 {
  "id": 2,
  "topic": "Equipment Cost",
  "question": "A machine has an invoice price of $84,000, 7% sales tax, $1,800 freight, $450 transit insurance, $2,700 for a concrete platform, $3,200 for installation, and $900 of trial runs. At what amount is it capitalized?",
  "options": [
   "$98,930",
   "$84,000",
   "$93,120",
   "$104,430"
  ],
  "answer": 0,
  "explanation": "$84,000 + $5,880 tax + $1,800 + $450 + $2,700 + $3,200 + $900 = $98,930. Every item is necessary to get the machine ready for use."
 },
 {
  "id": 3,
  "topic": "Land",
  "question": "Land is bought for $620,000 with title insurance of $3,500, a $24,000 commission, $7,200 of delinquent taxes assumed, $14,000 to raze an old building, $4,000 from selling its salvage, and $9,500 of grading. What is the land&rsquo;s cost?",
  "options": [
   "$620,000",
   "$678,200",
   "$658,200",
   "$674,200"
  ],
  "answer": 3,
  "explanation": "$620,000 + $3,500 + $24,000 + $7,200 + $14,000 &minus; $4,000 + $9,500 = $674,200. Salvage proceeds reduce cost; delinquent taxes assumed are part of cost."
 },
 {
  "id": 4,
  "topic": "Land Improvements",
  "question": "Why are a parking lot and sprinkler system recorded separately from the land?",
  "options": [
   "They are paid for after the land is bought",
   "They wear out, so they are depreciated, while land is not",
   "They are always expensed",
   "Their cost is always lower than the land&rsquo;s cost"
  ],
  "answer": 1,
  "explanation": "Land has an indefinite life and is never depreciated. Improvements have limited lives and must be depreciated, so they are recorded in their own account."
 },
 {
  "id": 5,
  "topic": "Property Taxes",
  "question": "A company buys land on July 1. Property taxes for the year after closing are $3,400, and the seller owed $7,200 of back taxes that the buyer pays. Which is correct?",
  "options": [
   "Capitalize both",
   "Expense both",
   "Capitalize the $7,200 to land; expense the $3,400",
   "Capitalize the $3,400 and expense the $7,200"
  ],
  "answer": 2,
  "explanation": "Back taxes assumed from the seller are a cost of acquiring the land. Taxes for the period the company owns the land are an operating cost, so they are expensed."
 },
 {
  "id": 6,
  "topic": "Lump Sum",
  "question": "A $2,800,000 purchase includes land (fair value $640,000), a building ($960,000), equipment ($800,000), a patent ($480,000), and inventory ($320,000). What cost is allocated to the building?",
  "options": [
   "$960,000",
   "$840,000",
   "$700,000",
   "$933,333"
  ],
  "answer": 1,
  "explanation": "Total fair value is $3,200,000. The building&rsquo;s share is $960,000 &divide; $3,200,000 = 30%, and 30% &times; $2,800,000 = $840,000."
 },
 {
  "id": 7,
  "topic": "Ethics of Allocation",
  "question": "Why might managers be tempted to allocate too much of a lump-sum price to land?",
  "options": [
   "Land is not depreciated, so expenses are lower and income is higher",
   "Land is taxed at a lower rate",
   "Land can be sold more easily",
   "Land must be recorded at appraisal value"
  ],
  "answer": 0,
  "explanation": "Assigning cost to land instead of depreciable assets lowers depreciation and raises reported income. The allocation must follow relative fair values."
 },
 {
  "id": 8,
  "topic": "Asset Retirement Obligation",
  "question": "When a company incurs a legal obligation to restore a site, what entry is made at fair value?",
  "options": [
   "Debit restoration expense; credit cash",
   "Debit asset retirement obligation; credit the asset",
   "Debit restoration expense; credit asset retirement obligation",
   "Debit the related asset; credit asset retirement obligation"
  ],
  "answer": 3,
  "explanation": "The liability is recorded at the present value of the expected cost, and the same amount is added to the cost of the related asset so the cost of using it includes the cost of retiring it."
 },
 {
  "id": 9,
  "topic": "Expected Cash Flow",
  "question": "Expected restoration outlays are $400,000 (30%), $500,000 (50%), and $650,000 (20%). The credit-adjusted risk-free rate is 7% and the work is four years away. What ARO is recorded?",
  "options": [
   "$500,000",
   "$477,000",
   "$381,448",
   "$650,000"
  ],
  "answer": 2,
  "explanation": "Expected outflow = $120,000 + $250,000 + $130,000 = $500,000. Present value = $500,000 &times; 0.762895 = $381,448."
 },
 {
  "id": 10,
  "topic": "Accretion and Oil &amp; Gas",
  "question": "An ARO of $381,448 is recorded at a 7% rate. What is true after one year?",
  "options": [
   "Accretion expense is $26,701, and the liability grows to $408,149",
   "Accretion expense is $26,701, and it is added to the asset",
   "Accretion is $381,448 &times; 7% and is capitalized",
   "Interest is not recorded until the work is done"
  ],
  "answer": 0,
  "explanation": "Accretion = $381,448 &times; 7% = $26,701. It is an expense that increases the liability toward the expected settlement amount; it is not added to the asset."
 }
];
let userAnswers = {};
function renderQuiz() {
const container = document.getElementById("quizContainer");
container.innerHTML = "";
quizData.forEach((q, index) => {
const card = document.createElement("section");
card.className = "quiz-card";
card.setAttribute("aria-labelledby", `q-title-${q.id}`);
const isAnswered = userAnswers[q.id] !== undefined;
let optionsHtml = "";
q.options.forEach((opt, optIndex) => {
let labelClass = "option-label";
if (isAnswered) { if (optIndex === q.answer) labelClass += " correct"; else if (optIndex === userAnswers[q.id]) labelClass += " incorrect"; }
const optId = `opt-${q.id}-${optIndex}`;
optionsHtml += `<label class="${labelClass}" id="label-${q.id}-${optIndex}" for="${optId}"><input type="radio" id="${optId}" name="question-${q.id}" value="${optIndex}" ${isAnswered ? "disabled" : ""} ${userAnswers[q.id] === optIndex ? "checked" : ""} onchange="handleOptionSelect(${q.id})"><span>${String.fromCharCode(65 + optIndex)}. ${opt}</span></label>`;
});
card.innerHTML = `<fieldset><legend><div class="card-meta"><span class="q-badge">Question ${index + 1} of 10</span><span class="topic-tag">${q.topic}</span></div><span class="question-text" id="q-title-${q.id}">${q.question}</span></legend><div class="options-list" role="radiogroup" aria-labelledby="q-title-${q.id}">${optionsHtml}</div><button type="button" class="submit-btn" id="btn-${q.id}" onclick="submitAnswer(${q.id})" ${isAnswered ? "disabled" : ""}>${isAnswered ? "Submitted" : "Submit Answer"}</button><div class="feedback-box ${isAnswered ? 'show ' + (userAnswers[q.id] === q.answer ? 'correct' : 'incorrect') : ''}" id="feedback-${q.id}" role="status" aria-live="polite"><strong>${isAnswered ? (userAnswers[q.id] === q.answer ? "Correct!" : "Incorrect.") : ""}</strong><div class="feedback-explanation">${isAnswered ? q.explanation : ""}</div></div></fieldset>`;
container.appendChild(card);
});
updateScoreboard();
}
function handleOptionSelect(qId) { const btn = document.getElementById(`btn-${qId}`); if (btn) btn.disabled = false; }
function submitAnswer(qId) {
const selectedInput = document.querySelector(`input[name="question-${qId}"]:checked`);
if (!selectedInput) return;
const selectedOpt = parseInt(selectedInput.value, 10);
userAnswers[qId] = selectedOpt;
const q = quizData.find(item => item.id === qId);
const isCorrect = selectedOpt === q.answer;
q.options.forEach((_, optIndex) => {
const label = document.getElementById(`label-${qId}-${optIndex}`);
const input = document.getElementById(`opt-${qId}-${optIndex}`);
input.disabled = true;
if (optIndex === q.answer) label.classList.add("correct"); else if (optIndex === selectedOpt) label.classList.add("incorrect");
});
const btn = document.getElementById(`btn-${qId}`); btn.disabled = true; btn.textContent = "Submitted";
const feedback = document.getElementById(`feedback-${qId}`);
feedback.className = `feedback-box show ${isCorrect ? 'correct' : 'incorrect'}`;
feedback.innerHTML = `<strong>${isCorrect ? "Correct!" : "Incorrect."}</strong><div class="feedback-explanation">${q.explanation}</div>`;
updateScoreboard();
}
function updateScoreboard() {
const answeredKeys = Object.keys(userAnswers);
const totalAnswered = answeredKeys.length;
let correctCount = 0;
answeredKeys.forEach(k => { const q = quizData.find(item => item.id === parseInt(k, 10)); if (userAnswers[k] === q.answer) correctCount++; });
const pct = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;
document.getElementById("scoreDisplay").textContent = `Score: ${correctCount} / 10 (${pct}%)`;
const progressPct = Math.round((totalAnswered / quizData.length) * 100);
document.getElementById("progressBar").style.width = `${progressPct}%`;
document.getElementById("progressBarWrapper").setAttribute("aria-valuenow", progressPct);
}
function resetQuiz() { userAnswers = {}; renderQuiz(); }
renderQuiz();
</script>
<script id="a11y-fixes-js">

(function () {

if (el.id) { try { if (document.querySelector('label[for="' + CSS.escape(el.id) + '"]')) return true; } catch (e) {} }
return !!el.closest('label');
}
function heading(el) {
var box = el.closest('fieldset,[class*="block"],[class*="part"],[class*="card"],section,article,.example,.problem');
while (box) {
var h = box.querySelector('legend,caption,h2,h3,h4,h5,[class*="title"],[class*="label"],[class*="recap"]');
if (h && txt(h)) return txt(h).slice(0, 80);
box = box.parentElement ? box.parentElement.closest('fieldset,section,article,[class*="block"],[class*="part"]') : null;
}

}

var cap = table && table.querySelector('caption');

if (tr && table) {
var cell = el.closest('td,th'), rows = Array.prototype.slice.call(table.rows), ri = rows.indexOf(tr);
var rowHead = tr.querySelector('th[scope="row"]') || (tr.cells[0] && tr.cells[0] !== cell && !tr.cells[0].querySelector('input,select,textarea') ? tr.cells[0] : null);
var head = table.tHead && table.tHead.rows.length ? table.tHead.rows[table.tHead.rows.length - 1] : (rows[0] && rows[0] !== tr && !rows[0].querySelector('input,select') ? rows[0] : null);
var colHead = head && cell ? head.cells[cell.cellIndex] : null;
var bodyIdx = table.tHead ? ri - table.tHead.rows.length + 1 : ri + (head ? 0 : 1);
if (rowHead && txt(rowHead)) bits.push(txt(rowHead).slice(0, 80)); else bits.push('line ' + bodyIdx);

if (!bits.length) bits.push(el.tagName === 'SELECT' ? 'Choose an option' : 'Answer');

}
function labelAll(root) {
(root || document).querySelectorAll('input:not([type="hidden"]):not([type="button"]):not([type="submit"]),select,textarea').forEach(function (el) {
if (!hasName(el)) el.setAttribute('aria-label', nameFor(el));

}
function wrapTables() {
document.querySelectorAll('table').forEach(function (t) {
if (t.closest('.a11y-scroll')) return;
var p = t.parentElement, s = p ? getComputedStyle(p) : null;
if (s && /auto|scroll/.test(s.overflowX)) return;
var avail = p ? p.clientWidth : 0;
if (!avail || t.scrollWidth <= avail + 1) return;
var w = document.createElement('div'); w.className = 'a11y-scroll';
if (!t.querySelector('input,select,textarea,button,a[href]')) {
w.setAttribute('role', 'region'); w.tabIndex = 0;
var c = t.querySelector('caption'); w.setAttribute('aria-label', (c && txt(c)) || 'Table (scrolls sideways)');
}
p.insertBefore(w, t); w.appendChild(t);
});
}
var live = null;
if (LIVE) {
live = document.createElement('div'); live.className = 'a11y-sr'; live.setAttribute('aria-live', 'polite'); live.setAttribute('role', 'status');
document.body.appendChild(live);
}
var RESULT = /(score|result|feedback|status|summary|message|msg|grade|total|verdict|outcome)/i;
var collecting = false, found = [];
function say(msg) { if (!live || !msg) return; live.textContent = ''; setTimeout(function () { live.textContent = msg; }, 60); }
var pending;
var mo = new MutationObserver(function (muts) {
clearTimeout(pending);
pending = setTimeout(function () { labelAll(); wrapTables(); }, 50);
if (!collecting) return;
muts.forEach(function (m) {
var n = m.target.nodeType === 1 ? m.target : m.target.parentElement;
while (n && n !== document.body) {
if (n === live) return;
if (RESULT.test((n.id || '') + ' ' + (typeof n.className === 'string' ? n.className : ''))) { if (found.indexOf(n) < 0) found.push(n); return; }
n = n.parentElement;
}
});
});
function start() {
labelAll(); wrapTables();
mo.observe(document.body, { childList: true, subtree: true, characterData: true });
document.addEventListener('click', function (e) {
if (!live || !e.target.closest('button')) return;
collecting = true; found = [];

collecting = false;
var msg = found.map(txt).filter(Boolean).join(' ').slice(0, 300);

}

})();

</script>
</body>
